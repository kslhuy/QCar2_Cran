# Canonical single-vehicle CARLA Tesla Model 3 profile.
vehicle:
  car_id: 0

runtime:
  loop_rate_hz: 20

modules:
  model: carla_model3
  io: carla
  observer: ekf_carla
  planner: sdcs_small_map
  controller: simple_carla
  v2v: "null"
  simulation: carla_sdcs_small_map
  ground_station: tcp_client

mission:
  # One right-hand-traffic SDCS circuit in the CARLA project frame.
  # The planner closes this open sequence because loop=1.
  node_sequence: [0, 2, 4, 6, 10]
  loop: 1
  target_velocity: 5.0
