# Canonical CARLA Tesla Model 3 composition.  A scenario or direct test owns
# the map-specific spawn transform and mission; this default is safe/empty.
vehicle:
  car_id: 0

runtime:
  loop_rate_hz: 20

modules:
  model: carla_model3
  io: carla
  observer: ekf_carla
  planner: sdcs_small_map
  controller: simple_carla
  v2v: "null"
  simulation: carla_sync
  ground_station: tcp_client

mission:
  path: null
  target_velocity: 0.0
