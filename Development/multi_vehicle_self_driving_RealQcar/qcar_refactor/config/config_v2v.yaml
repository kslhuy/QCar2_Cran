# Reusable V2V profiles for the refactored runtime.
# The config loader supplies vehicle_id from config_vehicle.yaml or the CLI.
# Multi-vehicle localhost arrangements belong in test/unit_test_v2v.py.

"null":
  enabled: false
  implementation: "null"

udp_default:
  enabled: true
  implementation: udp
  bind_ip: "0.0.0.0"
  base_port: 8000
  broadcast_rate_hz: 20
  peer_timeout_s: 2.0
  peers: []
