# Simulation sessions are selected independently from vehicle IO.  The session
# creates the simulated vehicle; the selected IO adapter only uses that vehicle.
"null":
  implementation: "null"

carla_sync:
  implementation: carla
  host: "127.0.0.1"
  port: 2000
  timeout_s: 20.0
  fixed_delta_seconds: 0.05
  warmup_ticks: 2
  ego_blueprint: vehicle.tesla.model3
  spawn_point_index: 0
  # Use this in custom/QLabs worlds where world.get_map() cannot provide
  # OpenDRIVE spawn points. These coordinates match the currently running
  # local QLabs scene and can be replaced for another map.
  spawn_transform:
    x: -13.1
    y: 0.8
    z: 0.5
    yaw: 0.0
  sensors:
    imu:
      enabled: true
      blueprint: sensor.other.imu
      transform:
        x: 0.0
        y: 0.0
        z: 0.0
