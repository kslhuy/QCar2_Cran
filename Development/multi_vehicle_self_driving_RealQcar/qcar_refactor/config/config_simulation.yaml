# Reusable platform session profiles. Vehicle spawn transforms, routes, and
# tick ownership belong in scenarios or test code.  Sensors created by a
# platform session belong to that session profile.
"null":
  implementation: "null"

carla_sync:
  implementation: carla
  host: "127.0.0.1"
  port: 2000
  timeout_s: 20.0
  fixed_delta_seconds: 0.05
  warmup_ticks: 2
  ego_blueprint: vehicle.tesla.model3
  # Used only by standalone vehicle_main CARLA runs when a scenario has not
  # supplied a per-vehicle spawn_transform for a custom world.
  default_spawn_transform: {x: -13.1, y: 0.8, z: 0.5, yaw: 0.0}
  sensors:
    imu:
      enabled: true
      blueprint: sensor.other.imu
      transform:
        x: 0.0
        y: 0.0
        z: 0.0
    # Standard shared CARLA scan source: horizontal 2-D scan at vehicle-body
    # height.  CARLA owns this actor, so it belongs to this session profile.
    lidar:
      enabled: true
      blueprint: sensor.lidar.ray_cast
      # CARLA callback hand-off only; IOCarla owns the normalized scan buffer.
      callback_queue_capacity: 8
      transform: {x: 0.0, y: 0.0, z: 0.5, pitch: 0.0, yaw: 0.0, roll: 0.0}
      attributes:
        channels: 1
        upper_fov: 0.0
        lower_fov: 0.0
        points_per_second: 7200
        rotation_frequency: 20
        range: 50
        sensor_tick: 0.05
      scan:
        frame_id: laser
        bin_count: 360
        range_min_m: 0.05
        range_max_m: 50.0
        scan_time_s: 0.05
        planar_z_tolerance_m: 0.05
