"null":
  implementation: "null"

simple_qcar:
  implementation: simple
  lookahead_distance: 0.5
  kp_velocity: 0.2
  ki_velocity: 0.0
  kd_velocity: 0.0
  feedforward_gain: 0.0
  steering_gain: 1.0
  max_throttle: 0.80
  min_throttle: -0.80
  max_steering: 0.48
  integral_limit: 1.0
  manual:
    command_timeout_s: 0.25
    max_throttle: 0.35
    max_steering: 0.30

simple_carla:
  implementation: simple
  kp_velocity: 0.35
  ki_velocity: 0.02
  kd_velocity: 0.0
  feedforward_gain: 0.0
  steering_gain: 0.75
  max_throttle: 0.80
  min_throttle: -0.80
  max_steering: 0.48
  integral_limit: 1.0

# Conservative profile for the deterministic virtual bicycle model.
# The fleet policy provides predecessor position, not a dense curvature path.
fleet_2d_virtual:
  implementation: fleet_2d
  desired_gap_m: 0.8
  time_headway_s: 0.5
  gap_gain: 0.35
  kp_velocity: 0.25
  steering_gain: 0.18
  max_velocity: 0.50
  max_throttle: 0.35
  min_throttle: -0.35
  max_steering: 0.30

fleet_2d_carla:
  implementation: fleet_2d
  desired_gap_m: 5.0
  time_headway_s: 0.5
  gap_gain: 0.45
  kp_velocity: 0.30
  steering_gain: 0.6
  max_velocity: 10.0
  max_throttle: 0.80
  min_throttle: -0.80
  max_steering: 0.48
