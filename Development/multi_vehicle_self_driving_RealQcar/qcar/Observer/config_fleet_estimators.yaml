# Fleet Estimator Configuration
# Default parameters for the fleet state estimators used by VehicleObserver
# Place this file under qcar/Observer/ and load it when starting observers.

# Options: 'consensus', 'distributed_luenberger', 'trust_consensus', 'trust_kalman'
fleet_estimator_type: trust_consensus



enable_recording: false # enable_recording: Controls data logging to CSV.
# true: Logs data to scope_recordings/ (e.g., local_V0_120000.csv).
# true: Logs data to scope_recordings/ (e.g., local_V0_120000.csv).
# false: No data is logged to these files.
recording_overwrite: true # recording_overwrite:
# true: Overwrites the file (e.g., fleet_V0.csv)
# false: Creates a new timestamped file every run (e.g., fleet_V0_123456.csv)
max_record_vehicles: 5 # max_record_vehicles: Number of fleet vehicle columns reserved in the CSV.

# Global defaults for fleet estimation
fleet:
  # State handling
  state_dim: 5               # State vector size (default 5: [x,y,theta,v,a])
  max_state_age_ns: 1000000000  # (ns) 1 second validity window for received states
  received_local_states_limit: 10
  received_fleet_states_limit: 5
  fleet_observer_rate: 25    # Hz - how often fleet estimator is updated

  # ---------------------------------------------------------------------
  # Consensus estimator defaults
  # ---------------------------------------------------------------------
  consensus:
    consensus_gain: 0.3      # (0-1) higher = faster consensus, less stable
    direct_gain: 0.7         # weight for direct self-reports vs consensus
    neighbor_weight_mode: uniform  # 'uniform' or 'distance' (reserved)


  # ---------------------------------------------------------------------
  # Distributed Luenberger estimator defaults
  # ---------------------------------------------------------------------
  distributed_luenberger:
    state_dim: 5             
    observer_gain: 0.1
    consensus_gain: 0.2
    
    # Debug recording settings
    debug_recording: true           # Enable internal state recording for debugging
    debug_output_dir: "observer_recordings"  # Directory for debug CSV files
    
    # Vehicle physical params (used in phi_i computation)
    m_i: 0.5
    tau_i: 0.16
    rho_i: 0.12
    Cd_i: 0.035
    AF_i: 0.22
    mu_i: 0.01

  # ---------------------------------------------------------------------
  # Trust-Based estimators
  # ---------------------------------------------------------------------
  # trust_consensus / trust_kalman parameters are loaded from:
  # TrustbasedDistributedObserver/config_trust_estimator.yaml
  #
  # Keep this parent file focused on global fleet defaults. If needed,
  # you can still add local override keys under `trust_consensus` or
  # `trust_kalman` and they will be merged before runtime overrides.

# Example override (when loading config into VehicleObserver):
# vehicle_observer_config:
#   observer:
#     observer_rate: 100
#     fleet_observer_rate: 40
#     consensus_gain: 0.25
#     observer_gain: 0.12
#     fleet:
#       consensus:
#         consensus_gain: 0.45
#         direct_gain: 0.55
#       distributed_kalman:
#         observer_gain: 0.15
#         consensus_gain: 0.25
#         weight_mode: adaptive
