# Fleet Estimator Configuration
# Default parameters for the fleet state estimators used by VehicleObserver
# Place this file under qcar/Observer/ and load it when starting observers.

# Options: 'consensus', 'distributed_luenberger', 'leadering_observer',
#          'classical_luenberger_observer', 'high_gain_luenberger_observer',
#          'classical_ekf_observer', 'parallel_observers',
#          'trust_consensus', 'trust_kalman'
fleet_estimator_type: distributed_luenberger

# Plotting configuration for general ouput observer
enable_plotting: false
enable_recording: true
plotting:
  fps: 30
  time_window: 20.0
  max_vehicles_plot: 5
  save_only: true


# Global defaults for fleet estimation
fleet:
  # State handling
  state_dim: 5               # State vector size (default 5: [x,y,theta,v,a])
  max_state_age_ns: 1000000000  # (ns) 1 second validity window for received states
  received_local_states_limit: 10
  received_fleet_states_limit: 5
  fleet_observer_rate: 100   # Hz - how often fleet estimator is updated

  # ---------------------------------------------------------------------
  # Consensus estimator defaults
  # ---------------------------------------------------------------------
  consensus:
    consensus_gain: 0.3      # (0-1) higher = faster consensus, less stable
    direct_gain: 0.7         # weight for direct self-reports vs consensus
    neighbor_weight_mode: uniform  # 'uniform' or 'distance' (reserved)


  # ---------------------------------------------------------------------
  # Distributed Luenberger estimator defaults
  # ---------------------------------------------------------------------
  distributed_luenberger:
    state_dim: 5             
    observer_gain: 0.1
    consensus_gain: 0.2
    
    # Debug recording settings
    debug_recording: true           # Enable internal state recording for debugging
    debug_output_dir: "observer_recordings"  # Directory for debug CSV files
    
    # Vehicle physical params (used in phi_i computation)
    m_i: 0.5
    tau_i: 0.16
    rho_i: 0.12
    Cd_i: 0.035
    AF_i: 0.22
    mu_i: 0.01

  # ---------------------------------------------------------------------
  # Leadering observer defaults
  # ---------------------------------------------------------------------
  leadering_observer:
    state_dim: 5
    debug_recording: true
    debug_output_dir: "observer_recordings"
    delay_compensation: true
    z0: 0
    gamma: 1.0
    eta: 0.16
    K_th: 1.00
    g_mode: linear               # 'nonlinear': x_hat[1]/(x_hat[0]+1)^2, 'linear': x_hat[1]
    use_timestamp_dt: true
    max_update_dt_s: 0.05
    max_hat_tau: 0.0
    hat_tau_attack_enabled: false
    hat_tau_attack_start_s: 40.0
    hat_tau_attack_duration_s: 0.5
    hat_tau_attack_bias_s: 0.5
    leader_vehicle_id: 0
    leader_position_index: 0
    leader_control_index: 1
    leader_control_delay_s: 0.0
    max_state_age_s: 6.0
    received_local_states_limit: 100
    v2v_measurement_delay_s: 0.0
    v2v_position_noise_std: 0.0

  # ---------------------------------------------------------------------
  # Classical Luenberger observer baseline
  # Same zeta structure as leadering_observer, without delay compensation.
  # ---------------------------------------------------------------------
  classical_luenberger_observer:
    state_dim: 5
    debug_recording: true
    debug_output_dir: "observer_recordings"
    recorder_prefix: "classical_luenberger_observer"
    delay_compensation: false
    gamma: 1.0
    eta: 0.16
    K_th: 1.00
    use_timestamp_dt: true
    max_update_dt_s: 0.05
    max_hat_tau: 0.0
    hat_tau_attack_enabled: false
    leader_vehicle_id: 0
    leader_position_index: 0
    leader_control_index: 1
    max_state_age_s: 6.0
    received_local_states_limit: 100
    v2v_measurement_delay_s: 0.0
    v2v_position_noise_std: 0.0
    output_mode: linear           # Gain is designed for direct leader-position output
    measurement_denominator_epsilon: 0.000001
    singularity_position_margin: 0.05
    initialize_position_from_measurement: true
    observer_gain: [1.58, 0.0332, -0.0050]

  # ---------------------------------------------------------------------
  # High-gain Luenberger observer baseline
  # Same as classical_luenberger_observer, but each observer gain component
  # is multiplied by high_gain raised to the corresponding exponent.
  # L_hg = L .* high_gain^[1, 2, 3] by default.
  # ---------------------------------------------------------------------
  high_gain_luenberger_observer:
    state_dim: 5
    debug_recording: true
    debug_output_dir: "observer_recordings"
    recorder_prefix: "high_gain_luenberger_observer"
    delay_compensation: false
    gamma: 1.0
    eta: 0.16
    K_th: 1.00
    use_timestamp_dt: true
    max_update_dt_s: 0.05
    max_hat_tau: 0.0
    hat_tau_attack_enabled: false
    leader_vehicle_id: 0
    leader_position_index: 0
    leader_control_index: 1
    max_state_age_s: 6.0
    received_local_states_limit: 100
    v2v_measurement_delay_s: 0.0
    v2v_position_noise_std: 0.0
    output_mode: linear           # HG gain is designed for direct leader-position output
    measurement_denominator_epsilon: 0.000001
    singularity_position_margin: 0.05
    initialize_position_from_measurement: true
    # Standard third-order high-gain base vector. With high_gain=2,
    # the effective gain is [6, 12, 8].
    observer_gain: [3.0, 3.0, 1.0]
    high_gain: 2.0
    high_gain_exponents: [1, 2, 3]

  # ---------------------------------------------------------------------
  # Classical EKF observer baseline
  # Position-only EKF for x_dot = f_x(x, u), y = [1, 0, 0] x.
  # ---------------------------------------------------------------------
  classical_ekf_observer:
    state_dim: 5
    debug_recording: true
    debug_output_dir: "observer_recordings"
    recorder_prefix: "classical_ekf_observer"
    delay_compensation: false
    eta: 0.16
    K_th: 1.00
    use_timestamp_dt: true
    max_update_dt_s: 0.05
    leader_vehicle_id: 0
    leader_position_index: 0
    leader_control_index: 1
    max_state_age_s: 6.0
    received_local_states_limit: 100
    v2v_measurement_delay_s: 0.0
    v2v_position_noise_std: 0.0
    output_mode: nonlinear        # 'nonlinear': 1/(x_leader+1), 'linear': V2V leader position
    measurement_denominator_epsilon: 0.000001
    initial_covariance: [1.0, 1.0, 1.0]
    process_noise_covariance: [0.0001, 0.001, 0.01]
    measurement_noise_covariance: 0.000001

  # ---------------------------------------------------------------------
  # Parallel observer comparison
  # Runs the delay-compensated observer and classical baselines together.
  # The primary estimator output is returned to the controller/fleet cache.
  # ---------------------------------------------------------------------
  parallel_observers:
    state_dim: 5
    debug_recording: true
    debug_output_dir: "observer_recordings"
    recording_trial_subdir: true
    # Optional fixed subfolder name under debug_output_dir. If empty, the
    # parallel observer creates trial_v{vehicle_id}_parallel_observers_YYYYmmdd_HHMMSS.
    # experiment_name: "trial_v1_delay_attack"
    primary_estimator: leadering_observer
    z0: 0
    gamma: 1.0
    eta: 0.16
    g_mode: linear               # 'nonlinear': x_hat[1]/(x_hat[0]+1)^2, 'linear': x_hat[1]
    use_timestamp_dt: true
    max_update_dt_s: 0.05
    leader_vehicle_id: 0
    leader_position_index: 0
    leader_control_index: 1
    max_state_age_s: 6.0
    received_local_states_limit: 100
    v2v_measurement_delay_s: 0.0
    v2v_position_noise_std: 0.0
    observers:
      leadering_observer:
        type: leadering_observer
        recorder_prefix: "leadering_observer"
        delay_compensation: true
        leader_control_delay_s: 0
        max_hat_tau: 0.0
        hat_tau_attack_enabled: false
        hat_tau_attack_start_s: 40.0
        hat_tau_attack_duration_s: 0.5
        hat_tau_attack_bias_s: 0.5
        K_th: 8.6993
        eta: 0.16
      classical_luenberger_observer:
        type: classical_luenberger_observer
        recorder_prefix: "classical_luenberger_observer"
        delay_compensation: false
        K_th: 8.6993
        max_hat_tau: 0.0
        hat_tau_attack_enabled: false
        output_mode: linear
        measurement_denominator_epsilon: 0.000001
        singularity_position_margin: 0.05
        initialize_position_from_measurement: true
        # With K_th=8.6993, the error poles are approximately
        # [-3.122557 +/- 2.341080j, -0.492290].
        # observer_gain: [0.48740358, 7.16989079, -41.25647017]
        observer_gain: [3.0,3.0,1.0]
      high_gain_luenberger_observer:
        type: high_gain_luenberger_observer
        recorder_prefix: "high_gain_luenberger_observer"
        delay_compensation: false
        K_th: 8.6993
        max_hat_tau: 0.0
        hat_tau_attack_enabled: false
        output_mode: linear
        measurement_denominator_epsilon: 0.000001
        singularity_position_margin: 0.05
        initialize_position_from_measurement: true
        # Standard third-order HG design: [3*l, 3*l^2, l^3].
        # At l=2 the effective gain is [6, 12, 8].
        observer_gain: [3.0, 3.0, 1.0]
        high_gain: 5.0
        high_gain_exponents: [1, 2, 3]
      classical_ekf_observer:
        type: classical_ekf_observer
        recorder_prefix: "classical_ekf_observer"
        delay_compensation: false
        K_th: 8.6993
        output_mode: linear
        measurement_denominator_epsilon: 0.000001
        initial_covariance: [1.0, 1.0, 1.0]
        process_noise_covariance: [0.0001, 0.001, 0.01]
        measurement_noise_covariance: 0.000001

  # ---------------------------------------------------------------------
  # Trust-Based Consensus estimator defaults
  # See TrustbasedDistributedObserver/config_trust_estimator.yaml for full options
  # ---------------------------------------------------------------------
  trust_consensus:
    observer_gain: 0.1
    consensus_gain: 0.2
    attack_mitigation: true
    trust:
      trust_threshold: 0.5
      dirichlet_type: "Dual"
      ema_alpha: 0.3
    weight:
      w0_fixed: 0.3
      w_self_base: 0.2
      w_cap: 0.4
      kappa: 5
      eta: 0.15

  # ---------------------------------------------------------------------
  # Trust-Based Kalman estimator defaults
  # ---------------------------------------------------------------------
  trust_kalman:
    observer_gain: 0.1
    consensus_gain: 0.2
    process_noise: 0.01
    measurement_noise: 0.1
    attack_mitigation: true
    trust:
      trust_threshold: 0.5
      dirichlet_type: "Dual"
    weight:
      w0_fixed: 0.3
      w_cap: 0.4

# Example override (when loading config into VehicleObserver):
# vehicle_observer_config:
#   observer:
#     observer_rate: 100
#     fleet_observer_rate: 40
#     consensus_gain: 0.25
#     observer_gain: 0.12
#     fleet:
#       consensus:
#         consensus_gain: 0.45
#         direct_gain: 0.55
#       distributed_kalman:
#         observer_gain: 0.15
#         consensus_gain: 0.25
#         weight_mode: adaptive
