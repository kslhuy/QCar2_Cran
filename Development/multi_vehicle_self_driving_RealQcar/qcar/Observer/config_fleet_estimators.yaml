#     fleet_observer_rate: 40
#     consensus_gain: 0.25
#     observer_gain: 0.12
#     fleet:
#       consensus:
#         consensus_gain: 0.45
#         direct_gain: 0.55
#       distributed_kalman:
#         observer_gain: 0.15
#         consensus_gain: 0.25
#         weight_mode: adaptive
