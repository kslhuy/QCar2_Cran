# Fleet Estimator Configuration
# Default parameters for the fleet state estimators used by VehicleObserver
# Place this file under qcar/Observer/ and load it when starting observers.

# Options: 'consensus', 'distributed_luenberger', 'distributed_HG', 'trust_consensus', 'trust_kalman'
fleet_estimator_type: distributed_HG

# Plotting configuration for general ouput observer
enable_plotting: false
enable_recording: true
plotting:
  fps: 30
  time_window: 20.0
  max_vehicles_plot: 5
  save_only: true


# Global defaults for fleet estimation
fleet:
  # State handling
  state_dim: 5               # State vector size (default 5: [x,y,theta,v,a])
  max_state_age_ns: 1000000000  # (ns) 1 second validity window for received states
  received_local_states_limit: 10
  received_fleet_states_limit: 5
  fleet_observer_rate: 200   # Hz - how often fleet estimator is updated

  # ---------------------------------------------------------------------
  # Consensus estimator defaults
  # ---------------------------------------------------------------------
  consensus:
    consensus_gain: 0.3      # (0-1) higher = faster consensus, less stable
    direct_gain: 0.7         # weight for direct self-reports vs consensus
    neighbor_weight_mode: uniform  # 'uniform' or 'distance' (reserved)


  # ---------------------------------------------------------------------
  # Distributed Luenberger estimator defaults
  # ---------------------------------------------------------------------
  distributed_luenberger:
    state_dim: 5             
    observer_gain: 0.1
    consensus_gain: 0.2
    
    # Debug recording settings
    debug_recording: true           # Enable internal state recording for debugging
    debug_output_dir: "observer_recordings"  # Directory for debug CSV files
    
    # Vehicle physical params (used in phi_i computation)
    m_i: 0.5
    tau_i: 0.16
    rho_i: 0.12
    Cd_i: 0.035
    AF_i: 0.22
    mu_i: 0.01

  # ---------------------------------------------------------------------
  # Distributed High-Gain LMI estimator defaults
  # ---------------------------------------------------------------------
  distributed_HG:
    state_dim: 5

    # HG observer model:
    # estimated_state = [x0, v0, a0, x1, v1, a1, ...]
    # fleet_states keeps [x, y, theta, velocity, acceleration].
    tau_i: 0.16
    c0: 0.007023
    c1: 0.14878
    throttle_gain: 8.6993

    # K_i_HG is used to build L_i = [0 ... theta*K_i_HG^T ... 0]^T.
    K_i_HG: [18.0442, 25.1158, 6.2953]

    # P_i in gamma*r_i*theta*T(theta)*P_i^{-1}*T^{-1}(theta).
    # A scalar is interpreted as scalar*I. You can replace it with a full matrix.
    P_i: 0.2
    gamma: 1.0
    r_i: 1.0
    high_gain_theta: 1.0
    initialize_from_true_states: true

    # Communication topology over all vehicles, including vehicle 0.
    # If omitted or dimension-mismatched, the estimator falls back to fully connected.
    adjacency_matrix:
      - [0, 1, 1, 1]
      - [1, 0, 1, 1]
      - [1, 1, 0, 1]
      - [1, 1, 1, 0]

    debug_recording: true
    debug_output_dir: "observer_recordings"
    distance_filter_alpha: 1.0
    velocity_filter_alpha: 1.0
    leader_velocity_filter_alpha: 1.0
    leader_position_filter_alpha: 1.0

    # Per-vehicle overrides. Keys may be car0/car1/... or numeric IDs.
    # These values are merged over the defaults above before constructing the estimator.
    vehicles:
      car0:
        K_i_HG: [18.0442, 25.1158, 6.2953]
