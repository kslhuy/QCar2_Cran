# Trust-Based Distributed Observer Configuration
# Configuration for trust model, weight calculation, and fleet estimation
# Place in qcar/Observer/TrustbasedDistributedObserver/

# =====================================================================
# Fleet Estimator Type Selection
# =====================================================================
# Options: 'trust_consensus', 'trust_kalman'
fleet_estimator_type: trust_consensus

# =====================================================================
# Global Fleet Settings (inherited from base estimators)
# =====================================================================
fleet:
  state_dim: 5                    # [x, y, theta, v, a]
  max_state_age_ns: 1000000000    # 1 second validity window
  fleet_observer_rate: 25         # Hz
  received_local_states_limit: 10
  received_fleet_states_limit: 5

# =====================================================================
# Trust Model Configuration (TriP Model)
# =====================================================================
trust:
  # Component weights (exponents for score calculation)
  # Higher weight = more sensitive to errors in that component
  weight_velocity: 1.0           # Velocity consistency weight (exponent, lower = more tolerant)
  velocity_tolerance: 0.2        # m/s - base absolute tolerance for velocity mismatch
  min_velocity_tolerance: 0.05    # m/s - hard lower bound for adaptive tolerance
  turn_velocity_tolerance_gain: 0.3   # extra tolerance in turns (scales with yaw-rate)
  accel_velocity_tolerance_gain: 0.25  # extra tolerance during accel/decel transients
  # Adaptive acceleration consistency (distance + relative velocity + turn-aware)
  acceleration_base_tolerance: 1.0
  acceleration_speed_tolerance_gain: 0.15
  acceleration_host_tolerance_gain: 0.6
  acceleration_turn_tolerance_gain: 0.8
  acceleration_distance_base_tolerance: 0.35
  acceleration_distance_turn_gain: 0.4
  acceleration_rel_velocity_tolerance: 0.2
  # Adaptive heading/path similarity
  heading_min_movement_m: 0.05
  heading_base_tolerance_rad: 0.35
  heading_turn_tolerance_gain: 1.0
  heading_yaw_rate_tolerance: 0.8
  # Turn-aware theta robustness in global trust Mahalanobis
  theta_similarity_distance_scale: 1.5
  theta_similarity_velocity_scale: 1.0
  theta_similarity_gain: 2.5
  theta_turn_gain: 2.0
  theta_contribution_cap: 3.0

  weight_distance: 2.0            # Distance consistency weight  
  weight_acceleration: 0.3        # Acceleration plausibility weight
  weight_heading: 0.3             # Heading consistency weight
  
  # Trust threshold for considering a vehicle "trusted"
  trust_threshold: 0.5
  
  # Dirichlet-based trust level parameters
  num_trust_levels: 5             # [Untrusted, Suspicious, Neutral, Trusted, Highly Trusted]
  dirichlet_update_rate: 0.1      # How fast trust levels update (0-1) — used by "ema" method
  dirichlet_type: "Dual"          # "Single" (local only) or "Dual" (local + cross-validation)
  # Dirichlet method: "ema" (simple EMA update) or "matlab" (aging-factor + regularized score)
  dirichlet_method: "matlab"
  # MATLAB Dirichlet parameters (only used when dirichlet_method: "matlab")
  dirichlet_C: 0.2                # Regularization constant C
  dirichlet_wt_local: 0.4         # Aging weight for local trust
  dirichlet_wt_global: 0.5        # Aging weight for global trust
  
  # Attack detection settings
  monitor_sudden_change: false     # Enable sudden trust change monitoring
  sudden_change_threshold: 0.5    # Threshold for sudden change detection
  attack_detection_window: 10     # Number of samples for attack detection
  
  # Communication quality parameters
  max_message_age_s: 1.0          # Maximum message age in seconds
  expected_beacon_interval_s: 0.1 # Expected beacon interval (10 Hz)
  
  # EMA smoothing for trust scores
  ema_alpha: 0.3                  # Smoothing factor (0-1, higher = less smoothing)

  # Validation and decay (MATLAB-parity features)
  use_physical_constraints_check: false
  use_temporal_consistency_check: false
  max_velocity: 5.0
  max_acceleration: 4.0
  max_deceleration: -5.0
  max_jerk: 8.0
  temporal_pos_tolerance_m: 0.5
  temporal_vel_tolerance: 0.5
  trust_decay_lambda: 0.2

  # Distance to Trust conversion method
  # Options: 'exponential', 'piecewise_linear', 'gaussian', 'sigmoid', 'chi_squared'
  distance_to_gamma_method: 'exponential'
  gamma_piecewise_min: 1.5
  gamma_piecewise_max: 5.0
  gamma_gaussian_sigma: 2.0
  gamma_sigmoid_k: 2.0
  gamma_sigmoid_thresh: 3.0
  gamma_chi2_dof_local: 2
  gamma_chi2_dof_global: 5

  # Distributed trust covariance parameters (always paper-style)
  distributed_trust_fallback: 0.2
  distributed_trust_covariance_diag: [2.0, 2.0, 2.0, 2.0, 2.0] # Sigma^2 for gamma_host (full state: x,y,theta,v,a)
  distributed_local_tau2_diag: [1.5, 0.5]  # Tau^2 for gamma_local_peer/gamma_self [distance, velocity] (MATLAB tau2_matrix_gamma_local)
  # Relative-trust mode:
  # true  = use [distance, relative_velocity]
  # false = use [distance] only (simple mode)
  use_relative_velocity_in_relative_trust: false

  # Generalized trust vector O_i(j) from exchanged trust reports
  use_generalized_trust_vector: true
  trust_vector_theta_min: 0.4

  # Message age quality gate (disable if timestamps are unreliable)
  use_message_age_quality: false

# =====================================================================
# Weight Calculation Configuration
# =====================================================================
weight:
  # Weight calculation type
  # Options: 'equal', 'trust_based', 'graph_based'
  # - 'equal': All neighbors get equal weight (simple consensus)
  # - 'trust_based': Trust-proportional weights with fixed w0 and w_self
  # - 'graph_based': Graph topology-based weights (matches old implementation)
  weight_type: trust_based
  
  # Fixed weight allocations (for trust_based mode)
  w0_fixed: 0.3                   # Weight for direct measurement (target's own broadcast)
  w_self_base: 0.2                # Base weight for self (persistence of own estimate)
  
  # Neighbor weight constraints
  w_cap: 0.4                      # Maximum weight per neighbor (influence cap - 40%)
  kappa: 3                        # Smaller kappa gives stronger direct/neighbor corrections in small fleets
  
  # Temporal smoothing (EMA)
  eta: 0.15                       # EMA smoothing factor
  enable_smoothing: false         # Enable weight smoothing between updates
  startup_fixed_duration_s: 5.0   # Keep fixed non-trust weights while platoon forms
  
  # Flag-driven w₀ adaptation factors
  # These multiply w₀ when an attack flag fires for the target being estimated
  flag_w0_target_attack_factor: 1.0     # Keep w₀ full when target under attack (local is reliable)
  flag_w0_global_est_check_factor: 0.3  # Reduce w₀ when local sensors are faulty
  flag_w0_local_est_check_factor: 0.5   # Reduce w₀ when local measurements unreliable

  # Advanced options
  use_distance_weighting: false   # Weight by physical distance (experimental)

# =====================================================================
# Observer/Estimator Gains
# =====================================================================
observer:
  observer_gain: 0.1              # Measurement correction gain (L in Luenberger)
  consensus_gain: 0.2             # Consensus correction gain
  
  # Attack mitigation
  attack_mitigation: false         # Enable automatic attack mitigation

  # Prediction-only switch (MATLAB-style)
  use_predict_observer: false
  max_predict_only_time: 3.0
  n_good: 3 
  blend_thresh: 3.0
  similarity_tolerances: [3.5, 2.0, 0.14, 2.0, 1.0]

  # Trust-triggered contamination rollback
  rollback_enabled: false
  rollback_window_size: 15
  
  # Kalman-specific parameters (for trust_kalman type)
  kalman:
    process_noise: 0.01           # Q - process noise covariance
    measurement_noise: 0.1        # R - measurement noise covariance
    initial_covariance: 1.0       # Initial P matrix diagonal

# =====================================================================
# Vehicle Dynamics Parameters (for prediction models)
# =====================================================================
vehicle:
  wheelbase: 0.256                # QCar wheelbase in meters
  max_velocity: 2.0               # Maximum velocity m/s
  max_acceleration: 5.0           # Maximum acceleration m/s^2
  max_steering: 0.5               # Maximum steering angle rad

  # Passive-calibrated first-order velocity lag:
  #   v_dot = -(1/tau) * v + (velocity_gain/tau) * throttle
  # This matches the online passive throttle_acceleration analysis output
  # better than the no-drag acceleration-lag model below because constant
  # throttle converges to a steady speed instead of unbounded velocity.
  velocity_lag_model:
    enabled: true
    tau: 0.301                    # From online_throttle_acceleration avg_tau
    velocity_gain: 6.598          # From online_throttle_acceleration avg_K [m/s per throttle]

  # Lightweight first-order acceleration lag:
  #   a_dot = -(1/tau) * a + (input_gain/tau) * u
  # Useful when you want DLE-like acceleration dynamics without the full
  # relative-state observer.
  #
  # IMPORTANT: here u is the TARGET VEHICLE'S broadcast longitudinal command,
  # not a relative-state control reconstructed from platoon gains.
  #
  # In the current stack, the CACC controller first computes:
  #   acc_desired = K * [spacing_error, velocity_error] + integral
  # and then converts it into the final QCar throttle:
  #   throttle = acc_to_throttle_gain * acc_desired + ff_throttle
  #
  # So this observer model uses the final broadcast throttle command as input.
  # That means the prediction is only meaningful when each vehicle shares its
  # own control_input over V2V.
  #
  # For this repo, local-state V2V messages already include:
  #   control_input.steering
  #   control_input.throttle
  # and TrustBasedFleetEstimator caches those per sender.
  #
  # If target throttle is missing, the estimator currently falls back to the
  # host control input. That fallback is only a placeholder and is usually NOT
  # physically correct for other vehicles.
  #
  # Therefore:
  # - enable this mode only if V2V control_input is available/reliable
  # - disable it if other vehicles do not broadcast throttle
  # - if you want a cleaner model, broadcast acc_desired explicitly instead
  #
  # Note on controller feedforward:
  # - QCar CACC can optionally add ff_throttle based on leader velocity
  # - so the transmitted throttle may already contain both feedback and
  #   feedforward contributions
  accel_lag_model:
    enabled: false
    tau: 0.318
    input_gain: 1.0               # Maps broadcast throttle to acceleration dynamics

  # First-order lag motor model (AccelDragMotorModel)
  # Replaces the naive "v += throttle * dt" in _predict_dynamics().
  # Parameters from Calibration/results/06_throttle_acceleration_model_calibration/
  motor_model:
    enabled: false                # Set true once calibrated params are validated
    # QLabs (simulation) calibrated values:
    tau: 0.318                    # Motor time constant [s]
    k_th: 4.5795                  # Forward throttle gain [m/s^2 per throttle]
    k_br: 4.5772                  # Brake gain [m/s^2 per throttle]
    c_v: 5.0                      # Velocity-proportional drag [1/s]
    c_fric: 2.0                   # Coulomb friction [m/s^2]
    # For real QCar hardware, use these instead (from motor_model_id.yaml):
    # tau: 1.82
    # k_th: 6.57
    # k_br: 6.57
    # c_v: 5.0
    # c_fric: 2.0

# =====================================================================
# Logging and Debugging
# =====================================================================
logging:
  log_trust_scores: true          # Log trust scores each update
  log_weight_updates: true        # Log weight calculations
  log_attack_flags: true          # Log attack detection flags
  log_interval_s: 1.0             # Logging interval in seconds

# =====================================================================
# Example: Different Configurations for Different Scenarios
# =====================================================================

# For high-trust environment (cooperative, no adversaries):
# trust:
#   trust_threshold: 0.3
#   weight_velocity: 5.0
#   dirichlet_type: "Single"
# weight:
#   w0_fixed: 0.4
#   w_cap: 0.5

# For adversarial environment (potential attackers):
# trust:
#   trust_threshold: 0.7
#   weight_velocity: 15.0
#   dirichlet_type: "Dual"
#   monitor_sudden_change: true
# weight:
#   w0_fixed: 0.2
#   w_cap: 0.3
# observer:
#   attack_mitigation: true

# For sparse communication (unreliable links):
# trust:
#   max_message_age_s: 2.0
#   expected_beacon_interval_s: 0.5
# weight:
#   w_self_base: 0.3
#   enable_smoothing: true
#   eta: 0.3
