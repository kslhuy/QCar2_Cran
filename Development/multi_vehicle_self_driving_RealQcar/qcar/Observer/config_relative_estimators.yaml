# Relative Estimator Configuration
# Default parameters for the relative state estimators used by VehicleObserver
# Place this file under qcar/Observer/ and load it when starting observers.

relative_estimator_type: sa_acc_uio
enable_relative: true # Enabled: only UIO output is routed to distributed trust.
                        # true: Enables the relative estimator and all related logic.
                        # false: Routes raw relative measurements directly to trust without UIO processing.

# Separate relative UIO CSV recording. Files are written asynchronously as
# relative_uio_log_V{id}.csv so trust logging and relative-observer diagnostics
# remain independent.
enable_recording: false
recording_overwrite: true
# recording_output_dir: null  # defaults to TrustbasedDistributedObserver/

# Relative estimator defaults
relative:
  # ---------------------------------------------------------------------
  # SA_ACC_UIO (Secure Aware ACC Unknown Input Observer)
  # ---------------------------------------------------------------------
  sa_acc_uio:
    Ts: 0.01      # Sample time
    tau: 0.3      # Time constant
    li: 0.3       # Vehicle length / safety distance
    Li: 0.25       # Desired distance (optional use in observer)
    h: 0.5        # Headway time
    k1: -0.8      # Controller gain 1
    k2: 2.5       # Controller gain 2
    alpha_lmi: 0.5 # LMI decay rate
    prefer_external_relative_measurement: true
    measurement_max_age_s: 0.2
    unknown_target_acceleration: true # Estimate the lumped unknown input; do not borrow target V2V acceleration.
    
    # MATLAB precomputed gains from Relative_obs/SA_ACC_UIO.m.
    # When K is configured, the Python observer skips CVXPY and uses these
    # gains directly. If L is omitted, L is derived as K + (Az - K*Ce)*Qz.
    K:
      - [0.5, 0.0]
      - [0.0, 1.0]
      - [0.5, -100.0]
      - [-8.3, 1427.2]
    # L is derived from K + (Az - K*Ce)*Qz. Do not mix independently rounded gains.
