# Simulation Parameters for Fake QCar

vehicle:
  id: 0
  model_type: "kinematic"   # Options: kinematic, dynamic, qlpv_legacy, qlpv_matrix
  longitudinal_model: "qlabs_velocity" # Options: default, qcar_real, qcar_sim, limo, real_car_61, qlabs_velocity
  longitudinal_model_source:
    profiles:
      qcar_real: "../Observer/extra_configs/throttle_acceleration_observer_model_real.yaml"
      qcar_sim: "../Observer/extra_configs/throttle_acceleration_observer_model_sim.yaml"
      limo: "../Observer/extra_configs/throttle_acceleration_observer_model_limo.yaml"
      real_car_61: "../Calibration/results/online_throttle_acceleration/calibration/61/throttle_acceleration_observer_model_latest.yaml"
      qlabs_velocity: "../Observer/extra_configs/throttle_velocity_observer_model_qlabs.yaml"
  steering_model: "default" # Options: default, qlabs_steering
  steering_model_source:
    profiles:
      qlabs_steering: "../Calibration/results/03_steering_calibration/steering_calibration_qlabs.yaml"
  params_file: "qcar"         # Options: qcar, vehicle1, vehicle2...
  tire_model: "static_linear"       # Options: static_linear, dynamic_linear, pacejka
  dt: 0.01                    # Simulation timestep (s)

disturbances:
  mode: "tire"        # Options: tire, general
  vx:
    type: "none"        # Options: none, constant, sine, step, random
    value: 1.0          # Magnitude
    freq: 1.0           # Frequency (Hz) for sine
  vy:
    type: "none"
    value: 0.5
    freq: 0.5
  r:
    type: "none"
    value: 0.8

sensors:
  gps:
    update_rate: 200.0    # Hz
    noise_pos: 0.05     # Standard deviation (m)
    noise_theta: 0.02   # Standard deviation (rad)
    has_noise: false
  imu:
    noise_accel: 0.1    # m/s^2
    noise_gyro: 0.01    # rad/s
    has_noise: false

initial_state:
  x: 0.0
  y: 0.0
  theta: 0.0
  v: 0.0
