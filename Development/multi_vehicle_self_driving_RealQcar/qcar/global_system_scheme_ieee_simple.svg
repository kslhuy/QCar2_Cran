<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1700" height="700" viewBox="0 0 1700 700" role="img" aria-labelledby="title desc">
  <title id="title">Color simplified trust-aware cooperative estimation scheme with platform photo</title>
  <desc id="desc">Journal-paper architecture diagram showing the QCar experimental platform, vehicle stack, V2V exchange, trust-aware distributed observer, and validation outputs.</desc>
  <defs>
    <filter id="shadow" x="-16%" y="-16%" width="132%" height="132%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <clipPath id="photoClip">
      <rect x="70" y="174" width="298" height="398" rx="12"/>
    </clipPath>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px "Arial", "Helvetica", sans-serif; fill: #111827; }
      .subtitle { font: 400 15px "Arial", "Helvetica", sans-serif; fill: #4b5563; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; filter: url(#shadow); }
      .panelBlue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.7; filter: url(#shadow); }
      .panelOrange { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.7; filter: url(#shadow); }
      .panelPurple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.7; filter: url(#shadow); }
      .panelGreen { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.7; filter: url(#shadow); }
      .panelRed { fill: #fff1f2; stroke: #b91c1c; stroke-width: 1.7; filter: url(#shadow); }
      .photoFrame { fill: #ffffff; stroke: #0f172a; stroke-width: 1.4; filter: url(#shadow); }
      .sectionTitle { font: 700 18px "Arial", "Helvetica", sans-serif; fill: #111827; }
      .boxTitle { font: 700 16px "Arial", "Helvetica", sans-serif; fill: #111827; }
      .boxText { font: 400 13.5px "Arial", "Helvetica", sans-serif; fill: #374151; }
      .small { font: 400 12.5px "Arial", "Helvetica", sans-serif; fill: #4b5563; }
      .caption { font: 700 13px "Arial", "Helvetica", sans-serif; fill: #111827; }
      .label { font: 700 11.5px "Arial", "Helvetica", sans-serif; fill: #334155; }
      .flowBlue { fill: none; stroke: #2563eb; stroke-width: 2.6; marker-end: url(#arrowBlue); }
      .flowOrange { fill: none; stroke: #c2410c; stroke-width: 2.6; marker-end: url(#arrowOrange); }
      .flowPurple { fill: none; stroke: #7c3aed; stroke-width: 2.6; marker-end: url(#arrowPurple); }
      .flowGreen { fill: none; stroke: #15803d; stroke-width: 2.6; marker-end: url(#arrowGreen); }
      .flowRed { fill: none; stroke: #b91c1c; stroke-width: 2.4; marker-end: url(#arrowRed); }
      .dashed { stroke-dasharray: 8 6; }
      .labelBox { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .badgeBlue { fill: #dbeafe; stroke: #60a5fa; }
      .badgeOrange { fill: #ffedd5; stroke: #fb923c; }
      .badgePurple { fill: #ede9fe; stroke: #a78bfa; }
      .badgeGreen { fill: #dcfce7; stroke: #4ade80; }
      .badgeRed { fill: #ffe4e6; stroke: #fb7185; }
      .badgeText { font: 700 11px "Arial", "Helvetica", sans-serif; fill: #111827; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="700"/>

  <text class="title" x="60" y="56">Trust-Aware Cooperative State Estimation: Experimental Scheme</text>
  <text class="subtitle" x="62" y="84">Simplified color figure for IEEE TVT results: platform, V2V information flow, trust-weighted observer, and validation products.</text>

  <!-- Platform photo -->
  <rect class="photoFrame" x="54" y="128" width="330" height="516" rx="12"/>
  <text class="sectionTitle" x="78" y="162">Experimental Platform</text>
  <image x="70" y="174" width="298" height="398" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)" href="image.png" xlink:href="image.png"/>
  <rect x="70" y="174" width="298" height="398" rx="12" fill="none" stroke="#111827" stroke-width="1.2"/>
  <rect x="70" y="590" width="298" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="caption" x="91" y="612">Multi-vehicle QCar/Limo testbed</text>

  <!-- Vehicle stack -->
  <rect class="panelBlue" x="430" y="128" width="260" height="516" rx="12"/>
  <text class="sectionTitle" x="456" y="162">1. Host Vehicle Stack</text>

  <rect x="456" y="196" width="208" height="80" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text class="boxTitle" x="478" y="226">Sensors</text>
  <text class="boxText" x="478" y="250">GPS, IMU, encoder,</text>
  <text class="boxText" x="478" y="270">camera and control input</text>

  <rect x="456" y="314" width="208" height="82" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text class="boxTitle" x="478" y="344">Local Observer</text>
  <text class="boxText" x="478" y="368">x_i = [x, y, theta, v, a]</text>
  <text class="boxText" x="478" y="388">host state estimate</text>

  <rect x="456" y="434" width="208" height="82" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text class="boxTitle" x="478" y="464">Vehicle Logic</text>
  <text class="boxText" x="478" y="488">observer scheduling,</text>
  <text class="boxText" x="478" y="508">telemetry and control</text>

  <rect class="badgeBlue" x="456" y="552" width="208" height="40" rx="8"/>
  <text class="badgeText" x="492" y="576">real-time closed loop</text>

  <!-- V2V layer -->
  <rect class="panelOrange" x="748" y="128" width="258" height="516" rx="12"/>
  <text class="sectionTitle" x="774" y="162">2. V2V Exchange</text>

  <rect x="778" y="202" width="198" height="138" rx="18" fill="#ffffff" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="boxTitle" x="820" y="242">UDP Network</text>
  <text class="boxText" x="815" y="272">local state</text>
  <text class="boxText" x="815" y="296">fleet estimate</text>
  <text class="boxText" x="815" y="320">trust report</text>

  <rect x="778" y="380" width="198" height="78" rx="8" fill="#ffffff" stroke="#c2410c"/>
  <text class="boxTitle" x="808" y="410">Peer Vehicles</text>
  <text class="boxText" x="806" y="434">same stack on</text>
  <text class="boxText" x="806" y="454">each vehicle</text>

  <rect class="badgeOrange" x="778" y="498" width="198" height="58" rx="8"/>
  <text class="boxTitle" x="803" y="524">Attack Channel</text>
  <text class="boxText" x="805" y="546">clean vs. attacked data</text>

  <!-- Trust observer -->
  <rect class="panelPurple" x="1064" y="128" width="326" height="516" rx="12"/>
  <text class="sectionTitle" x="1090" y="162">3. Trust-Based Observer</text>

  <rect x="1094" y="196" width="266" height="82" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text class="boxTitle" x="1118" y="226">Trust Evaluation</text>
  <text class="boxText" x="1118" y="250">consistency, beacon quality,</text>
  <text class="boxText" x="1118" y="270">physical and temporal gates</text>

  <rect x="1094" y="316" width="266" height="82" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text class="boxTitle" x="1118" y="346">Adaptive Fusion Weights</text>
  <text class="boxText" x="1118" y="370">direct, self, neighbor terms</text>
  <text class="boxText" x="1118" y="390">threshold and influence cap</text>

  <rect x="1094" y="436" width="266" height="88" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text class="boxTitle" x="1118" y="466">Distributed Estimation</text>
  <text class="boxText" x="1118" y="490">trust-weighted correction,</text>
  <text class="boxText" x="1118" y="510">prediction and rollback</text>

  <rect class="badgePurple" x="1094" y="560" width="266" height="40" rx="8"/>
  <text class="badgeText" x="1138" y="584">resilient fleet state estimate</text>

  <!-- Results -->
  <rect class="panelGreen" x="1450" y="128" width="196" height="516" rx="12"/>
  <text class="sectionTitle" x="1474" y="162">4. Results</text>

  <rect x="1474" y="196" width="148" height="78" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text class="boxTitle" x="1492" y="226">Fleet State</text>
  <text class="boxText" x="1492" y="250">trajectory, speed,</text>
  <text class="boxText" x="1492" y="270">confidence</text>

  <rect x="1474" y="316" width="148" height="78" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text class="boxTitle" x="1492" y="346">Trust Data</text>
  <text class="boxText" x="1492" y="370">scores, flags,</text>
  <text class="boxText" x="1492" y="390">weights</text>

  <rect x="1474" y="436" width="148" height="88" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text class="boxTitle" x="1492" y="466">Validation</text>
  <text class="boxText" x="1492" y="490">plots, CSV,</text>
  <text class="boxText" x="1492" y="510">RMSE, attack</text>
  <text class="boxText" x="1492" y="530">detection</text>

  <rect class="badgeGreen" x="1474" y="560" width="148" height="40" rx="8"/>
  <text class="badgeText" x="1494" y="584">paper figures</text>

  <!-- Arrows inside and across panels -->
  <path class="flowBlue" d="M 560 276 L 560 314"/>
  <path class="flowBlue" d="M 560 396 L 560 434"/>
  <path class="flowOrange" d="M 664 356 L 710 356 L 710 276 L 778 276"/>
  <rect class="labelBox" x="680" y="286" width="76" height="24" rx="5"/>
  <text class="label" x="692" y="302">broadcast</text>

  <path class="flowOrange" d="M 778 430 L 708 430 L 708 472 L 664 472"/>
  <rect class="labelBox" x="678" y="442" width="82" height="24" rx="5"/>
  <text class="label" x="692" y="458">received</text>

  <path class="flowPurple" d="M 976 276 L 1036 276 L 1036 236 L 1094 236"/>
  <path class="flowPurple" d="M 1227 278 L 1227 316"/>
  <path class="flowPurple" d="M 1227 398 L 1227 436"/>

  <path class="flowGreen" d="M 1360 480 L 1418 480 L 1418 236 L 1474 236"/>
  <path class="flowGreen" d="M 1360 480 L 1418 480 L 1418 356 L 1474 356"/>
  <path class="flowGreen" d="M 1360 480 L 1474 480"/>

  <path class="flowRed dashed" d="M 976 528 L 1038 528 L 1038 632 L 1418 632 L 1418 500 L 1474 500"/>
  <rect class="labelBox" x="1108" y="618" width="206" height="26" rx="5"/>
  <text class="label" x="1122" y="635">attack metadata and replay logs</text>

  <path class="flowBlue dashed" d="M 1094 586 L 1040 586 L 1040 666 L 560 666 L 560 592"/>
  <rect class="labelBox" x="732" y="652" width="188" height="26" rx="5"/>
  <text class="label" x="746" y="669">fleet estimate to controller</text>

  <path class="flowPurple dashed" d="M 877 202 L 877 102 L 1227 102 L 1227 196"/>
  <rect class="labelBox" x="962" y="90" width="164" height="26" rx="5"/>
  <text class="label" x="976" y="107">neighbor opinions O_j(k)</text>
</svg>
