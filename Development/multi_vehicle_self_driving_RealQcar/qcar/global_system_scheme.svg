<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">QCar multi-vehicle trust-aware distributed observer global scheme</title>
  <desc id="desc">Architecture diagram showing VehicleLogic, V2V communication, VehicleObserver, the TriP trust framework, distributed observer, visualization, logging, and validation flows.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 17px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .laneTitle { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .laneFile { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #64748b; letter-spacing: 0.3px; }
      .boxTitle { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .boxText { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #374151; }
      .smallText { font: 400 12px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .tinyText { font: 500 11px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .badge { font: 700 11px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; filter: url(#softShadow); }
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
      .runtime { stroke: #0f766e; fill: #ecfdf5; }
      .observer { stroke: #2563eb; fill: #eff6ff; }
      .v2v { stroke: #c2410c; fill: #fff7ed; }
      .trust { stroke: #7c3aed; fill: #f5f3ff; }
      .output { stroke: #15803d; fill: #f0fdf4; }
      .validation { stroke: #b91c1c; fill: #fff1f2; }
      .lineBlue { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .lineTeal { fill: none; stroke: #0f766e; stroke-width: 2.4; marker-end: url(#arrowTeal); }
      .lineOrange { fill: none; stroke: #c2410c; stroke-width: 2.4; marker-end: url(#arrowOrange); }
      .linePurple { fill: none; stroke: #7c3aed; stroke-width: 2.4; marker-end: url(#arrowPurple); }
      .lineGreen { fill: none; stroke: #15803d; stroke-width: 2.4; marker-end: url(#arrowGreen); }
      .lineRed { fill: none; stroke: #b91c1c; stroke-width: 2.2; marker-end: url(#arrowRed); }
      .dashed { stroke-dasharray: 8 6; }
      .flowLabel { fill: #ffffff; stroke: #d1d5db; stroke-width: 0.8; }
      .labelText { font: 600 11px "Segoe UI", Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1200"/>

  <text class="title" x="54" y="54">Global Scheme: V2V Logic, Trust Framework, Distributed Observer, Visualization, Validation</text>
  <text class="subtitle" x="56" y="84">Each vehicle runs this stack; V2V packets couple the local observer with the fleet trust-aware distributed observer.</text>

  <rect x="54" y="106" width="1692" height="38" rx="8" fill="#0f172a"/>
  <text x="78" y="131" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Runtime scope</text>
  <text x="204" y="131" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cbd5e1">VehicleLogic main loop: sensor update -> observer update -> control -> telemetry/status/V2V broadcast</text>
  <text x="1440" y="131" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">Host vehicle H, peers N, targets T</text>

  <!-- Main lanes -->
  <g id="runtime-lane">
    <rect class="lane" x="54" y="170" width="330" height="505" rx="8"/>
    <text class="laneTitle" x="78" y="204">Vehicle Runtime</text>
    <text class="laneFile" x="78" y="224">vehicle_logic.py</text>

    <rect class="card runtime" x="78" y="248" width="282" height="112" rx="8"/>
    <text class="boxTitle" x="98" y="276">Main loop</text>
    <text class="boxText" x="98" y="300">_update_sensor_data(dt)</text>
    <text class="boxText" x="98" y="320">_observer_update(dt)</text>
    <text class="boxText" x="98" y="340">_control_logic_update(dt)</text>
    <rect x="255" y="266" width="83" height="24" rx="6" fill="#d1fae5" stroke="#10b981"/>
    <text class="badge" x="272" y="282">100 Hz</text>

    <rect class="card runtime" x="78" y="382" width="282" height="126" rx="8"/>
    <text class="boxTitle" x="98" y="410">Sensors and perception</text>
    <text class="boxText" x="98" y="434">QCar: tach, IMU, battery, gyro</text>
    <text class="boxText" x="98" y="454">GPS pose: x, y, theta, valid flag</text>
    <text class="boxText" x="98" y="474">YOLO relative distance / v_rel</text>
    <text class="boxText" x="98" y="494">Last steering and throttle input</text>

    <rect class="card runtime" x="78" y="530" width="282" height="118" rx="8"/>
    <text class="boxTitle" x="98" y="558">Controller and safety</text>
    <text class="boxText" x="98" y="582">StateMachine, WatchdogTimer</text>
    <text class="boxText" x="98" y="602">PlatoonController / ControllerManager</text>
    <text class="boxText" x="98" y="622">Uses local + fleet estimates</text>
    <text class="boxText" x="98" y="642">Outputs steering and throttle</text>
  </g>

  <g id="observer-lane">
    <rect class="lane" x="424" y="170" width="350" height="505" rx="8"/>
    <text class="laneTitle" x="448" y="204">Vehicle Observer Manager</text>
    <text class="laneFile" x="448" y="224">Observer/VehicleObserverSimple.py</text>

    <rect class="card observer" x="448" y="248" width="302" height="96" rx="8"/>
    <text class="boxTitle" x="468" y="276">VehicleObserver</text>
    <text class="boxText" x="468" y="300">Loads YAML configs and factories</text>
    <text class="boxText" x="468" y="320">Maintains sensor, state, V2V caches</text>

    <rect class="card observer" x="448" y="366" width="302" height="96" rx="8"/>
    <text class="boxTitle" x="468" y="394">Local state estimator</text>
    <text class="boxText" x="468" y="418">EKF / Luenberger / neural options</text>
    <text class="boxText" x="468" y="438">local_state = [x, y, theta, v, a]</text>

    <rect class="card observer" x="448" y="484" width="302" height="82" rx="8"/>
    <text class="boxTitle" x="468" y="512">Relative estimator</text>
    <text class="boxText" x="468" y="536">External relative measurement cache</text>
    <text class="boxText" x="468" y="556">SA_ACC_UIO / YOLO target anchor</text>

    <rect class="card observer" x="448" y="588" width="302" height="60" rx="8"/>
    <text class="boxTitle" x="468" y="616">Fleet estimator interface</text>
    <text class="boxText" x="468" y="640">add_received_*() and get_*_broadcast()</text>
  </g>

  <g id="v2v-lane">
    <rect class="lane" x="814" y="170" width="350" height="505" rx="8"/>
    <text class="laneTitle" x="838" y="204">V2V Logic and Network</text>
    <text class="laneFile" x="838" y="224">V2V/v2v_manager.py, v2v_communication.py</text>

    <rect class="card v2v" x="838" y="248" width="302" height="112" rx="8"/>
    <text class="boxTitle" x="858" y="276">V2VManager</text>
    <text class="boxText" x="858" y="300">Schedules local, fleet, trust, heartbeat</text>
    <text class="boxText" x="858" y="320">Routes handlers into VehicleObserver</text>
    <text class="boxText" x="858" y="340">Stores clean and attacked histories</text>
    <rect x="1044" y="266" width="76" height="24" rx="6" fill="#fed7aa" stroke="#fb923c"/>
    <text class="badge" x="1064" y="282">25/10/2 Hz</text>

    <rect class="card v2v" x="838" y="382" width="302" height="86" rx="8"/>
    <text class="boxTitle" x="858" y="410">Attack wrapper</text>
    <text class="boxText" x="858" y="434">V2VAttackInjector wraps V2VManager</text>
    <text class="boxText" x="858" y="454">Clean channel + attacked channel</text>

    <rect class="card v2v" x="838" y="490" width="302" height="82" rx="8"/>
    <text class="boxTitle" x="858" y="518">UDP / msgpack transport</text>
    <text class="boxText" x="858" y="542">local_state, fleet_state</text>
    <text class="boxText" x="858" y="562">trust_report, heartbeat, warning</text>

    <rect class="card v2v" x="838" y="594" width="302" height="54" rx="8"/>
    <text class="boxTitle" x="858" y="622">Peer fleet</text>
    <text class="boxText" x="858" y="642">Every peer runs the same stack</text>
  </g>

  <g id="trust-lane">
    <rect class="lane" x="1204" y="170" width="542" height="505" rx="8"/>
    <text class="laneTitle" x="1228" y="204">Trust Framework and Distributed Observer</text>
    <text class="laneFile" x="1228" y="224">Observer/TrustbasedDistributedObserver/</text>

    <rect class="card trust" x="1228" y="248" width="494" height="62" rx="8"/>
    <text class="boxTitle" x="1248" y="276">TrustBasedFleetEstimator</text>
    <text class="boxText" x="1248" y="300">Inputs: host state, peer local/fleet states, trust reports, relative measurements</text>

    <rect class="card trust" x="1228" y="332" width="236" height="168" rx="8"/>
    <text class="boxTitle" x="1248" y="360">TriPTrustModel</text>
    <text class="boxText" x="1248" y="384">Component checks: velocity,</text>
    <text class="boxText" x="1248" y="404">distance, acceleration, heading</text>
    <text class="boxText" x="1248" y="424">Beacon quality and packet age</text>
    <text class="boxText" x="1248" y="444">Physical and temporal gates</text>
    <text class="boxText" x="1248" y="464">Dirichlet levels + O_i(j)</text>
    <text class="boxText" x="1248" y="484">Flags: target, local, global</text>

    <rect class="card trust" x="1486" y="332" width="236" height="168" rx="8"/>
    <text class="boxTitle" x="1506" y="360">WeightTrustModule</text>
    <text class="boxText" x="1506" y="384">w0: direct target packet</text>
    <text class="boxText" x="1506" y="404">w_self: host prediction memory</text>
    <text class="boxText" x="1506" y="424">w_N: trusted neighbor estimates</text>
    <text class="boxText" x="1506" y="444">Trust threshold and kappa cap</text>
    <text class="boxText" x="1506" y="464">Influence cap + EMA smoothing</text>
    <text class="boxText" x="1506" y="484">Startup fixed weights fallback</text>

    <rect class="card trust" x="1228" y="522" width="494" height="126" rx="8"/>
    <text class="boxTitle" x="1248" y="550">Distributed observer core</text>
    <text class="boxText" x="1248" y="574">Correction: w0 * (T broadcast - xhat_T)</text>
    <text class="boxText" x="1248" y="594">+ sum w_N * (N estimate of T - xhat_T)</text>
    <text class="boxText" x="1248" y="614">Prediction, constraints, output low pass, rollback replay</text>
    <text class="boxText" x="1248" y="634">Outputs: fleet_states, confidence, trust_scores, trust_report payload</text>
  </g>

  <!-- Bottom output lane -->
  <g id="output-lane">
    <rect class="lane" x="54" y="720" width="1692" height="392" rx="8"/>
    <text class="laneTitle" x="78" y="754">Visualization, Logging, and Validation</text>
    <text class="laneFile" x="78" y="774">Ground Station, GUI, scope recorder, trust logger, plot scripts, validation tools</text>

    <rect class="card output" x="78" y="804" width="330" height="134" rx="8"/>
    <text class="boxTitle" x="100" y="832">Real-time visualization</text>
    <text class="boxText" x="100" y="856">GroundStationClient telemetry queue</text>
    <text class="boxText" x="100" y="876">qcar_gui panels and fleet controls</text>
    <text class="boxText" x="100" y="896">ScopeDataStreamer binary packets</text>
    <text class="boxText" x="100" y="916">Local, control, error, fleet traces</text>

    <rect class="card output" x="442" y="804" width="358" height="134" rx="8"/>
    <text class="boxTitle" x="464" y="832">Offline records and plots</text>
    <text class="boxText" x="464" y="856">scope_recordings/local and fleet CSV</text>
    <text class="boxText" x="464" y="876">trust_weight_log_V*.csv</text>
    <text class="boxText" x="464" y="896">relative_uio_log_V*.csv</text>
    <text class="boxText" x="464" y="916">plot_scope_data.py and plot_trust_data.py</text>

    <rect class="card validation" x="834" y="804" width="392" height="134" rx="8"/>
    <text class="boxTitle" x="856" y="832">Online validation gates</text>
    <text class="boxText" x="856" y="856">Required V2V fields and timestamp_ref_ns</text>
    <text class="boxText" x="856" y="876">Physical constraints: velocity, acceleration, jerk</text>
    <text class="boxText" x="856" y="896">Temporal consistency and beacon freshness</text>
    <text class="boxText" x="856" y="916">Attack flags annotate trust and state traces</text>

    <rect class="card validation" x="1260" y="804" width="462" height="134" rx="8"/>
    <text class="boxTitle" x="1282" y="832">Experiment validation and replay</text>
    <text class="boxText" x="1282" y="856">V2V attack scenarios provide clean vs attacked ground truth</text>
    <text class="boxText" x="1282" y="876">Trust CSV includes weights, gamma terms, flags, prediction gaps</text>
    <text class="boxText" x="1282" y="896">Robust KalmanNet dataset recording and validation scripts</text>
    <text class="boxText" x="1282" y="916">Unit tests for trust memory and observer modules</text>

    <rect x="78" y="972" width="1644" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="boxTitle" x="100" y="1002">Closed-loop data products</text>
    <text class="boxText" x="100" y="1028">Controller receives estimated host state and fleet state; V2V receives current local/fleet/trust payloads; Ground Station receives telemetry and scope samples.</text>
    <text class="boxText" x="100" y="1050">Validation compares clean, attacked, trusted, consensus, and post-prediction states to explain trust decisions and observer performance.</text>
  </g>

  <!-- Inter-lane data flow arrows -->
  <path class="lineTeal" d="M 360 424 C 392 424, 402 418, 424 418"/>
  <rect class="flowLabel" x="332" y="390" width="147" height="24" rx="5"/>
  <text class="labelText" x="345" y="406">sensor cache update</text>

  <path class="lineBlue" d="M 750 306 C 786 306, 802 306, 838 306"/>
  <rect class="flowLabel" x="760" y="272" width="126" height="24" rx="5"/>
  <text class="labelText" x="773" y="288">broadcast payloads</text>

  <path class="lineOrange" d="M 838 548 C 802 548, 786 548, 750 548"/>
  <rect class="flowLabel" x="752" y="558" width="142" height="24" rx="5"/>
  <text class="labelText" x="764" y="574">received V2V data</text>

  <path class="linePurple" d="M 750 622 C 920 696, 1080 686, 1228 628"/>
  <rect class="flowLabel" x="912" y="650" width="176" height="24" rx="5"/>
  <text class="labelText" x="925" y="666">fleet estimator update</text>

  <path class="linePurple" d="M 1228 292 C 1148 292, 1130 378, 1140 424 C 1150 472, 1190 474, 1228 474"/>
  <rect class="flowLabel" x="1097" y="390" width="120" height="24" rx="5"/>
  <text class="labelText" x="1108" y="406">trust reports</text>

  <path class="linePurple" d="M 1228 640 C 1110 702, 914 704, 750 636"/>
  <rect class="flowLabel" x="928" y="696" width="180" height="24" rx="5"/>
  <text class="labelText" x="940" y="712">fleet states + trust</text>

  <path class="lineOrange" d="M 1722 634 C 1760 634, 1760 578, 1722 578"/>
  <rect class="flowLabel" x="1604" y="681" width="118" height="24" rx="5"/>
  <text class="labelText" x="1616" y="697">trust_report out</text>
  <path class="lineOrange" d="M 1228 610 C 1196 610, 1182 610, 1140 610"/>

  <path class="lineOrange" d="M 1140 624 C 1188 690, 1420 690, 1608 648"/>
  <rect x="1512" y="674" width="167" height="24" rx="5" fill="#fff7ed" stroke="#fdba74"/>
  <text class="labelText" x="1524" y="690">peer fleet UDP exchange</text>

  <path class="lineBlue" d="M 232 648 C 232 688, 232 748, 232 804"/>
  <path class="lineBlue" d="M 600 648 C 600 690, 600 748, 600 804"/>
  <path class="linePurple" d="M 1475 648 C 1475 690, 1475 748, 1475 804"/>
  <path class="lineGreen" d="M 244 938 C 244 956, 244 962, 244 972"/>
  <path class="lineGreen" d="M 620 938 C 620 956, 620 962, 620 972"/>
  <path class="lineRed" d="M 1030 938 C 1030 956, 1030 962, 1030 972"/>
  <path class="lineRed" d="M 1491 938 C 1491 956, 1491 962, 1491 972"/>

  <path class="lineRed dashed" d="M 1030 804 C 1030 710, 1120 638, 1228 610"/>
  <rect class="flowLabel" x="1046" y="752" width="144" height="24" rx="5"/>
  <text class="labelText" x="1058" y="768">validation feedback</text>

  <path class="lineGreen dashed" d="M 408 870 C 480 744, 614 704, 750 640"/>
  <rect class="flowLabel" x="498" y="730" width="125" height="24" rx="5"/>
  <text class="labelText" x="509" y="746">operator insight</text>

  <!-- Legend -->
  <g id="legend">
    <rect x="54" y="1130" width="1692" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="tinyText" x="78" y="1158">Legend:</text>
    <line x1="138" y1="1154" x2="198" y2="1154" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <text class="tinyText" x="210" y="1158">sensor/control data</text>
    <line x1="360" y1="1154" x2="420" y2="1154" stroke="#c2410c" stroke-width="3" marker-end="url(#arrowOrange)"/>
    <text class="tinyText" x="432" y="1158">V2V packets</text>
    <line x1="548" y1="1154" x2="608" y2="1154" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <text class="tinyText" x="620" y="1158">trust, weights, observer state</text>
    <line x1="820" y1="1154" x2="880" y2="1154" stroke="#15803d" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text class="tinyText" x="892" y="1158">visualization/logging</text>
    <line x1="1078" y1="1154" x2="1138" y2="1154" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowRed)"/>
    <text class="tinyText" x="1150" y="1158">validation, attacks, replay</text>
    <text class="tinyText" x="1290" y="1158">Source: VehicleLogic, V2VManager, VehicleObserver, TrustBasedFleetEstimator</text>
  </g>
</svg>
