# ============================================================================
# Vehicle Controller Configuration
# ============================================================================
# This file centralizes ALL controller parameters for both longitudinal 
# and lateral control. Change parameters in ONE place for the entire system.
# ============================================================================

# ============================================================================
# GENERAL CONTROL CONFIGURATION
# ============================================================================
enable_steering_control: true  # Enable/disable steering control system

# ============================================================================
# LONGITUDINAL CONTROLLER CONFIGURATION
# ============================================================================

# Controller type options: 'cacc', 'pid', 'hybrid', 'fix', 'state_feedback', 'state_feedback_no_observer'
longitudinal_controller_type: 'state_feedback'

# CACC Controller Parameters
cacc:
  s0: 0.7                    # Minimum spacing (meters)
  h: 0.3                     # Time headway (seconds)
  K_spacing: 0.3             # Spacing error gain
  K_velocity: 0.05           # Velocity error gain
  acc_to_throttle_gain: 0.65  # Conversion gain from acceleration to throttle
  max_throttle: 0.25          # Maximum throttle output
  alpha_filter: 0.3          # Low-pass filter coefficient (0-1)
  ki_velocity: 0.1           # Velocity integral gain for additional stability

# PID Velocity Controller Parameters
pid:
  kp: 0.3                    # Proportional gain
  ki: 0.2                    # Integral gain
  kd: 0.005                  # Derivative gain
  max_throttle: 0.1          # Maximum throttle output
  ei_max: 1.0                # Integral anti-windup limit
  v_ref: 0.6                # Default reference velocity (m/s)

# Optional velocity schedule for FOLLOWING_PATH (Scheme 2)
# If enabled, path-following v_ref is switched by elapsed time in FOLLOWING_PATH state.
# velocity_sequence:
#   - {velocity: 0.45, duration: 40}   # First 40s
#   - {velocity: 1.00, duration: 9999} # Then hold

# Hybrid Longitudinal Controller Parameters (uses both CACC and PID)
hybrid_longitudinal:
  # Uses CACC when leader available, PID when not
  use_cacc_params: true      # Use params from 'cacc' section
  use_pid_params: true        # Use params from 'pid' section

fix:
  throttle: 0.075

# State Feedback Controller Parameters (CACC-based with distributed Luenberger observer)
state_feedback:
  max_throttle: 0.3           # Maximum throttle output
  throttle_smoothing: 0.7     # Exponential smoothing factor (0-1, higher = smoother)
  # Note: Observer (DistributedLuenbergerEstimator) is automatically injected by ControllerManager
  # K matrices are defined in state_feedback_controller.py based on vehicle_id

# State Feedback Controller without Observer (uses true V2V states directly)
state_feedback_no_observer:
  max_throttle: 0.3           # Maximum throttle output
  throttle_smoothing: 0.7     # Exponential smoothing factor (0-1, higher = smoother)
  # Note: This controller reads true vehicle states from V2V communication instead of observer estimates
  # Observer instance is still needed to access V2V communication data (received_local_states)
  # K matrices are defined in state_feedback_controller_no_observer.py based on vehicle_id

# ============================================================================
# LATERAL CONTROLLER CONFIGURATION
# ============================================================================

# Controller type options: 'pure_pursuit', 'stanley', 'lookahead', 'hybrid', 'fusion', 'path', 'fix_lateral'
lateral_controller_type: 'fix_lateral'

# Fix Lateral Controller Parameters (constant steering)
fix_lateral:
  steering: 0             # Fixed steering angle (radians, 0 = straight)

# Pure Pursuit Controller Parameters
pure_pursuit:
  lookahead_distance: 0.2    # Base lookahead distance (meters)
  k_steering: 0.4            # Proportional steering gain
  max_steering: 0.55         # Maximum steering angle (radians)
  adaptive_lookahead: true   # Enable adaptive lookahead based on distance
  # Turning section parameters (for corner-cutting prevention)
  curvature_threshold: 0.3   # Lane curvature threshold for turn detection
  turn_lookahead_offset: 0.1 # Lateral offset in turns (meters)
  turn_lookahead_gain: 1.5   # Lookahead distance multiplier in turns

# Stanley Controller Parameters
stanley:
  k_e: 0.5                   # Cross-track error gain
  k_soft: 1.0                # Softening gain to prevent division by zero
  max_steering: 0.55         # Maximum steering angle (radians)

# Lookahead Controller Parameters
lookahead:
  ri: 0.8                    # Desired inter-vehicle spacing (meters)
  hi: 0.3                    # Time headway (seconds)
  l_r: 0.141                 # Distance from CG to rear axle (meters)
  l_f: 0.115                 # Distance from CG to front axle (meters)
  k1: 1.0                    # Lateral control gain
  k2: 1.0                    # Yaw rate control gain
  max_steering: 0.55         # Maximum steering angle (radians)

# Hybrid Lateral Controller Parameters
hybrid_lateral:
  primary_controller: 'pure_pursuit'   # Controller to use when close (see pure_pursuit params)
  secondary_controller: 'stanley'      # Controller to use when far (see stanley params)
  switch_distance: 1.5                 # Distance threshold for switching (meters)
  use_primary_params: true             # Use params from primary controller section
  use_secondary_params: true           # Use params from secondary controller section

# Fusion Lateral Controller Parameters (combines path + leader tracking)
fusion_lateral:
  mode: 'path_primary'       # 'path_primary', 'leader_primary', 'adaptive'
  path_weight: 0.7           # Weight for path reference (0-1)
  leader_weight: 0.3         # Weight for leader adjustment (0-1)
  deviation_threshold: 0.3   # Max leader deviation before override (radians)
  smoothing_factor: 0.8      # Output smoothing (0-1, higher = smoother)
  max_steering: 0.55         # Maximum steering angle (radians)

# ============================================================================
# VEHICLE PARAMETERS (for all controllers)
# ============================================================================
vehicle:
  wheelbase: 0.256           # Total wheelbase (l_r + l_f) in meters
  l_r: 0.141                 # Distance from CG to rear axle (meters)
  l_f: 0.115                 # Distance from CG to front axle (meters)

# ============================================================================
# QUICK SWITCH PRESETS
# ============================================================================
# Uncomment the sections you want to use:

# ------------------------------------------------------------------------
# Preset 1: Aggressive Following (Tight spacing, responsive)
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'cacc'
# lateral_controller_type: 'pure_pursuit'
# cacc:
#   s0: 1.0
#   h: 0.3
#   K_spacing: 0.3
#   K_velocity: 0.08
# pure_pursuit:
#   lookahead_distance: 0.8
#   k_steering: 1.2

# ------------------------------------------------------------------------
# Preset 2: Conservative/Safe Following (Large spacing, smooth)
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'cacc'
# lateral_controller_type: 'stanley'
# cacc:
#   s0: 2.0
#   h: 0.7
#   K_spacing: 0.15
#   K_velocity: 0.03
# stanley:
#   k_e: 0.3
#   k_soft: 1.5

# ------------------------------------------------------------------------
# Preset 3: Simple Velocity Tracking (No spacing control)
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'pi'
# lateral_controller_type: 'pure_pursuit'

# ------------------------------------------------------------------------
# Preset 4: Best of Both Worlds (Adaptive hybrid controllers)
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'hybrid'
# lateral_controller_type: 'hybrid'

# ------------------------------------------------------------------------
# Preset 5: Advanced Lookahead Control
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'cacc'
# lateral_controller_type: 'lookahead'
# lookahead:
#   k1: 1.2
#   k2: 1.0
#   ri: 1.5

# ============================================================================
# PER-VEHICLE CONTROLLER CONFIGURATION
# ============================================================================
# Override controller settings for specific vehicles
# Follows the same structure as observer per-vehicle config
# If a vehicle is not listed here, it uses the global defaults above

# Constant throttle and Longitudinal speed 
# 0.5 throttle --> Constant speed ~2 m/s
# 0.25 throttle --> Constant speed ~1.6 m/s
# 0.15 throttle --> Constant speed ~1 m/s
# 0.025 throttle --> Constant speed ~0.12 m/s
# 0.05 throttle --> Constant speed ~0.29 m/s
# 0.06 throttle --> Constant speed ~0.36 m/s
per_vehicle_controllers:
  # Vehicle 0 (Leader in most formations)
  0:
    longitudinal_controller_type: 'pid'  # Fixed throttle for leader
    lateral_controller_type: 'fix_lateral'  # Straight line
    # Optional per-vehicle override for velocity schedule (FOLLOWING_PATH)
    velocity_sequence:
      - {velocity: 0.5, duration: 999999}
      - {velocity: 0.1, duration: 1.5}
      - {velocity: 0.2, duration: 1.5}
      - {velocity: 0.3, duration: 1.5}
      - {velocity: 0.4, duration: 1.5}
      - {velocity: 0.5, duration: 1.5}
      - {velocity: 0.6, duration: 40}
      - {velocity: 0.45, duration: 1.5}
      - {velocity: 0.3, duration: 1.5}
      - {velocity: 0.0, duration: 10}
      - {velocity: 0.2, duration: 1.5}
      - {velocity: 0.4, duration: 1.5}
      - {velocity: 0.8, duration: 1.5}
      - {velocity: 1, duration: 40}
      - {velocity: 0.75, duration: 1.5}
      - {velocity: 0.5, duration: 1.5}
      - {velocity: 0.25, duration: 1.5}
      - {velocity: 0.00, duration: 20}


    fix:
      throttle: 0.075  # Constant speed 
    fix_lateral:
      steering: 0.0
    throttle_sequence:
      # Throttle sweep: 0.01 to 0.25, step 0.01, duration 15 each
      - {throttle: 0.01, duration: 15}
      - {throttle: 0.02, duration: 15}
      - {throttle: 0.03, duration: 15}
      - {throttle: 0.04, duration: 15}
      - {throttle: 0.05, duration: 15}
      - {throttle: 0.06, duration: 15}
      - {throttle: 0.07, duration: 15}
      - {throttle: 0.08, duration: 15}
      - {throttle: 0.09, duration: 15}
      - {throttle: 0.10, duration: 15}
      - {throttle: 0.11, duration: 15}
      - {throttle: 0.12, duration: 15}
      - {throttle: 0.13, duration: 15}
      - {throttle: 0.14, duration: 15}
      - {throttle: 0.15, duration: 15}
      - {throttle: 0.16, duration: 15}
      - {throttle: 0.17, duration: 15}
      - {throttle: 0.18, duration: 15}
      - {throttle: 0.19, duration: 15}
      - {throttle: 0.20, duration: 15}
      - {throttle: 0.21, duration: 15}
      - {throttle: 0.22, duration: 15}
      - {throttle: 0.23, duration: 15}
      - {throttle: 0.24, duration: 15}
      - {throttle: 0.25, duration: 15}
    pid:
      kp: 0.3                    # Proportional gain
      ki: 0.2                    # Integral gain
      kd: 0.005                  # Derivative gain
      max_throttle: 0.2          # Maximum throttle output
      ei_max: 1.0                # Integral anti-windup limit
      v_ref: 0.6                 # Default reference velocity (m/s)
      # Sinusoidal disturbance parameters (simulating wind effects on leader velocity)
      disturbance_amplitude: 0.0   # Amplitude of sinusoidal disturbance (m/s)
      disturbance_frequency: 0.2    # Frequency of disturbance (Hz)
      disturbance_phase: 0.0        # Initial phase (radians)

  
  # Vehicle 1 (First Follower)
  1:
    longitudinal_controller_type: 'classical_distributed'  # Uses true V2V states for control
    lateral_controller_type: 'fix_lateral'
    fix:
      throttle: 0.00  # Constant speed
    classical_distributed:
      max_throttle: 0.2
      throttle_smoothing: 0.0
      leader_fix_throttle: 0.1 # Feedforward term based on leader's fixed throttle
    state_feedback:
      max_throttle: 0.3
      throttle_smoothing: 0.0
      leader_fix_throttle: 0.1 # Feedforward term based on leader's fixed throttle
    fix_lateral:
      steering: 0.0
    lookahead:
        ri: 0.4              # Desired inter-vehicle spacing (meters)
        hi: 0.3                # Time headway (seconds)
  
  # Vehicle 2 (Second Follower)
  2:
    longitudinal_controller_type: 'classical_distributed'  # Uses true V2V states for control
    lateral_controller_type: 'fix_lateral'
    fix:
      throttle: 0.0  # Constant speed
    classical_distributed:
      max_throttle: 0.2
      throttle_smoothing: 0.0 # Slightly smoother than vehicle 1
      leader_fix_throttle: 0.1 # Feedforward term based on leader's fixed throttle
    state_feedback:
      max_throttle: 0.3
      throttle_smoothing: 0.0 # Slightly smoother than vehicle 1
      leader_fix_throttle: 0.1 # Feedforward term based on leader's fixed throttle
    fix_lateral:
      steering: 0.0
    lookahead:
        ri: 0.4              # Desired inter-vehicle spacing (meters)
        hi: 0.3                # Time headway (seconds)

  # Vehicle 3 (Third Follower)
  3:
    longitudinal_controller_type: 'classical_distributed'  # Uses true V2V states for control
    lateral_controller_type: 'fix_lateral'
    fix:
      throttle: 0.0  # Constant speed
    classical_distributed:
      max_throttle: 0.2
      throttle_smoothing: 0.0  # Smoothest
      leader_fix_throttle: 0.1 # Feedforward term based on leader's fixed throttle
    state_feedback:
      max_throttle: 0.3
      throttle_smoothing: 0.0  # Smoothest
      leader_fix_throttle: 0.1 # Feedforward term based on leader's fixed throttle
    fix_lateral:
      steering: 0.0
    lookahead:
        ri: 0.4              # Desired inter-vehicle spacing (meters)
        hi: 0.3                # Time headway (seconds)

# Notes on per-vehicle configuration:
# 1. Any parameter not specified for a vehicle uses the global default
# 2. You can override controller type per vehicle
# 3. You can fine-tune individual parameters per vehicle
# 4. This is useful for:
#    - Assigning different roles (leader vs follower)
#    - Compensating for hardware differences
#    - Testing different control strategies
#    - Optimizing formation stability
