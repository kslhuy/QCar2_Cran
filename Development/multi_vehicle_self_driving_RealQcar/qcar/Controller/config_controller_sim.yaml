# ============================================================================
# Vehicle Controller Configuration
# ============================================================================
# This file centralizes ALL controller parameters for both longitudinal 
# and lateral control. Change parameters in ONE place for the entire system.
# ============================================================================

# ============================================================================
# GENERAL CONTROL CONFIGURATION
# ============================================================================
enable_steering_control: true  # Enable/disable steering control system

# ============================================================================
# STATE-SPECIFIC CONTROLLER DEFAULTS
# ============================================================================
# "Following Path" state controllers (autonomous path-following)
path_longitudinal_controller_type: 'pid'   # Speed loop used in FOLLOWING_PATH
path_lateral_controller_type: 'pp_map'     # Lateral controller for FOLLOWING_PATH

# "Following Leader" state controllers (platoon / leader-tracking)
leader_longitudinal_controller_type: 'cacc'      # Gap/speed tracking in FOLLOWING_LEADER
leader_lateral_controller_type: 'pure_pursuit'   # Lateral mode while following leader

# Legacy fallback (used if state-specific keys are missing)
# ============================================================================
# LONGITUDINAL CONTROLLER CONFIGURATION
# ============================================================================

# Controller type options: 'cacc', 'pid', 'hybrid'
longitudinal_controller_type: 'pid'

# CACC Controller Parameters
cacc:
  s0: 0.7                    # Minimum spacing (meters)
  h: 0.6                     # Time headway (seconds)
  K_spacing: 0.12             # Spacing error gain , High values make the car lurch forward aggressively if it falls slightly behind.
  K_velocity: 0.35           # Velocity error gain ,  Low values make the car ignore the leader's smooth speedometer and act purely based on the distance gap.
  spacing_mode: "path_or_projected"  # 'euclidean', 'projected', 'blended', 'path', 'path_or_projected'
  projection_heading_source: "leader" # Heading source for longitudinal projection ,  Assume the road's direction is the exact direction the "projection_heading_source" here is the leader car is currently pointing."
  blend_heading_deg: 20.0    # Used only when spacing_mode: 'blended'
  min_effective_spacing: 0.0 # Minimum gap fed to CACC after projectio
  acc_to_throttle_gain: 0.65  # Conversion gain from acceleration to throttle
  max_throttle: 0.25          # Maximum throttle output
  alpha_filter: 0.3          # Low-pass filter coefficient (0-1) , Values closer to 1.0 pass raw jerky throttle commands directly to the motor. Values closer to 0.0 create a "lazy" and smooth pedal effect.
  ki_velocity: 0.1           # Velocity integral gain for additional stability, High values make the car try to correct speed errors very aggressively, often causing oscillation (jerky speed changes).

# PID Velocity Controller Parameters
pid:
  kp: 0.1                   # Proportional gain (lower = softer accel response)
  ki: 0.03                  # Integral gain (lower = less surge after target jumps)
  kd: 0.0                    # Derivative gain (set to 0.0 to prevent throttle spikes)
  max_throttle: 0.24         # Maximum throttle output (limits aggressive launches)
  min_throttle: 0.0         # Minimum throttle (allows active braking in simulation)
  ei_max: 0.5                # Integral anti-windup limit
  v_ref: 0.6                # Default reference velocity (m/s)



# SA-ACC Controller Parameters
sa_acc:
  tau: 0.4
  h: 0.5
  k1: -0.8
  k2: 2.5
  li: 5.0
  Li: 8.0
  acc_to_throttle_gain: 0.65
  max_throttle: 0.30

fix:
  throttle: 0.075

# ============================================================================
# LATERAL CONTROLLER CONFIGURATION
# ============================================================================

# Controller type options: 'pure_pursuit', 'stanley', 'lookahead', 'hybrid', 'fusion', 'path', 'pp_map'
lateral_controller_type: 'pp_map'  # legacy fallback

# Pure Pursuit Controller Parameters
pure_pursuit:
  lookahead_distance: 0.25    # Base lookahead distance (meters)
  k_steering: 0.5            # Proportional steering gain
  max_steering: 0.5         # Maximum steering angle (radians)
  adaptive_lookahead: true   # Enable adaptive lookahead based on distance
  # Turning section parameters (for corner-cutting prevention)
  curvature_threshold: 0.15   # Lane curvature threshold for turn detection
  turn_lookahead_offset: 0.2 # Lateral offset in turns (meters) , Push the target point wider in turns to prevent corner cutting
  turn_lookahead_gain: 1.5   # Lookahead distance multiplier in turns , Extend lookahead distance even further when in a turn

# Map-based PP_Controller mode parameters (used when lateral_controller_type: 'pp_map')
pp_map:
  sample_ds: 0.02                 # [m] path resampling spacing for rich trajectory
  desired_speed: 0.6              # [m/s] design cruise speed used to build base speed profile
  min_speed: 0.4                  # [m/s] lower speed floor in profile generation
  kappa_speed_gain: 1.0           # Curvature->speed reduction gain (higher = slower in turns)
  max_speed: 0.75                 # [m/s] upper bound of profile speed
  hard_turn_kappa: 0.60           # [1/m] curvature threshold for "hard-turn" speed cap
  hard_turn_speed: 0.36           # [m/s] cap applied when |curvature| >= hard_turn_kappa
  t_clip_min: 0.3                 # [m] minimum L1 lookahead distance
  t_clip_max: 1.0                 # [m] maximum L1 lookahead distance
  m_l1: 0.50                      # L1 slope: lookahead contribution per m/s (L1 = q_l1 + m_l1*v)
  q_l1: 0.15                      # [m] L1 base offset at low speed
  speed_lookahead: 0.2            # [s] forward prediction horizon for selecting speed waypoint
  lat_err_coeff: 0.15             # [0..1] speed downscale sensitivity to lateral error
  acc_scaler_for_steer: 1.0       # Steering scale when accelerating (acc_now >= +1 m/s^2)
  dec_scaler_for_steer: 1.0       # Steering scale when decelerating (acc_now <= -1 m/s^2)
  start_scale_speed: 0.25         # [m/s] begin steering downscale above this speed
  end_scale_speed: 0.85           # [m/s] full steering downscale reached at this speed
  downscale_factor: 0.45          # Max steering reduction at/above end_scale_speed
  speed_lookahead_for_steer: 0.18 # [s] forward prediction horizon for steer scaling speed
  prioritize_dyn: false           # Reserved switch for dynamic-priority behavior in PP module
  trailing_gap: 0.8               # [m] desired spacing in TRAILING mode
  trailing_p_gain: 0.6            # P gain for trailing gap controller
  trailing_i_gain: 0.0            # I gain for trailing gap controller
  trailing_d_gain: 0.1            # D gain for trailing gap controller
  blind_trailing_speed: 0.2       # [m/s] minimum speed when opponent visibility is degraded
  obstacle_avoidance_enabled: true
  obstacle_replan_period: 0.4    # [s] minimum time between local avoidance replans
  obstacle_min_detect_dist: 0.15   # [m] ignore detections closer than this (too late/noisy)
  obstacle_max_detect_dist: 1.5   # [m] far detections are ignored for local planning
  obstacle_car_radius: 0.1        # [m] local planner obstacle radius for cars
  obstacle_person_radius: 0.1     # [m] local planner obstacle radius for pedestrians
  obstacle_influence: 0.80        # [m] distance around obstacle where path is pushed away
  obstacle_clearance: 0.05        # [m] extra safety margin in addition to obstacle radius
  car_overtake_mode: true         # false = trailing (stop behind car), true = overtake (replan around car)

# Stanley Controller Parameters
stanley:
  k_e: 0.3                   # Cross-track error gain
  k_soft: 1.25                # Softening gain to prevent division by zero
  max_steering: 0.5         # Maximum steering angle (radians)

# Lookahead Controller Parameters
lookahead:
  ri: 0.8                    # Desired inter-vehicle spacing (meters)
  hi: 0.3                    # Time headway (seconds)
  l_r: 0.141                 # Distance from CG to rear axle (meters)
  l_f: 0.115                 # Distance from CG to front axle (meters)
  k1: 1.0                    # Lateral control gain
  k2: 1.0                    # Yaw rate control gain
  max_steering: 0.5         # Maximum steering angle (radians)


# Fusion Lateral Controller Parameters (combines path + leader tracking)
fusion_lateral:
  mode: 'path_primary'       # 'path_primary', 'leader_primary', 'adaptive' , ''
  path_weight: 0.7           # Weight for path reference (0-1)
  leader_weight: 0.3         # Weight for leader adjustment (0-1)
  deviation_threshold: 0.3   # Max leader deviation before override (radians)
  smoothing_factor: 0.8      # Output smoothing (0-1, higher = smoother)
  max_steering: 0.5         # Maximum steering angle (radians)

# ============================================================================
# VEHICLE PARAMETERS (for all controllers)
# ============================================================================
vehicle:
  wheelbase: 0.256           # Total wheelbase (l_r + l_f) in meters
  l_r: 0.141                 # Distance from CG to rear axle (meters)
  l_f: 0.115                 # Distance from CG to front axle (meters)

# ============================================================================
# QUICK SWITCH PRESETS
# ============================================================================
# Uncomment the sections you want to use:

# ------------------------------------------------------------------------
# Preset 1: Aggressive Following (Tight spacing, responsive)
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'cacc'
# lateral_controller_type: 'pure_pursuit'
# cacc:
#   s0: 1.0
#   h: 0.3
#   K_spacing: 0.3
#   K_velocity: 0.08
# pure_pursuit:
#   lookahead_distance: 0.8
#   k_steering: 1.2

# ------------------------------------------------------------------------
# Preset 2: Conservative/Safe Following (Large spacing, smooth)
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'cacc'
# lateral_controller_type: 'stanley'
# cacc:
#   s0: 2.0
#   h: 0.7
#   K_spacing: 0.15
#   K_velocity: 0.03
# stanley:
#   k_e: 0.3
#   k_soft: 1.5

# ------------------------------------------------------------------------
# Preset 3: Simple Velocity Tracking (No spacing control)
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'pi'
# lateral_controller_type: 'pure_pursuit'

# ------------------------------------------------------------------------
# Preset 4: Best of Both Worlds (Adaptive hybrid controllers)
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'hybrid'
# lateral_controller_type: 'hybrid'

# ------------------------------------------------------------------------
# Preset 5: Advanced Lookahead Control
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'cacc'
# lateral_controller_type: 'lookahead'
# lookahead:
#   k1: 1.2
#   k2: 1.0
#   ri: 1.5
