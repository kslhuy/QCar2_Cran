# ------------------------------------------------------------------------
# longitudinal_controller_type: 'cacc'
# lateral_controller_type: 'stanley'
# cacc:
#   s0: 2.0
#   h: 0.7
#   K_spacing: 0.15
#   K_velocity: 0.03
# stanley:
#   k_e: 0.3
#   k_soft: 1.5

# ------------------------------------------------------------------------
