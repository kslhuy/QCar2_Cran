# ============================================================================
# Vehicle Controller Configuration
# ============================================================================
# This file centralizes ALL controller parameters for both longitudinal 
# and lateral control. Change parameters in ONE place for the entire system.
# ============================================================================

# ============================================================================
# GENERAL CONTROL CONFIGURATION
# ============================================================================
enable_steering_control: true  # Enable/disable steering control system

# ============================================================================
# STATE-SPECIFIC CONTROLLER DEFAULTS
# ============================================================================
# "Following Path" state controllers (autonomous path-following)
path_longitudinal_controller_type: 'pid'
path_lateral_controller_type: 'pp_map'

# "Following Leader" state controllers (platoon / leader-tracking)
leader_longitudinal_controller_type: 'cacc'
leader_lateral_controller_type: 'pure_pursuit'

# Legacy fallback (used if state-specific keys are missing)
# ============================================================================
# LONGITUDINAL CONTROLLER CONFIGURATION
# ============================================================================

# Controller type options: 'cacc', 'pi', 'hybrid'
longitudinal_controller_type: 'cacc'

# CACC Controller Parameters
cacc:
  s0: 0.8                    # Minimum spacing (meters)
  h: 0.3                     # Time headway (seconds)
  K_spacing: 0.3             # Spacing error gain
  K_velocity: 0.05           # Velocity error gain
  spacing_mode: "path_or_projected"  # 'euclidean', 'projected', 'blended', 'path', 'path_or_projected'
  projection_heading_source: "leader" # Heading source for longitudinal projection
  blend_heading_deg: 20.0    # Used only when spacing_mode: 'blended'
  min_effective_spacing: 0.0 # Minimum gap fed to CACC after projection
  acc_to_throttle_gain: 0.5  # Conversion gain from acceleration to throttle
  max_throttle: 0.3          # Maximum throttle output
  alpha_filter: 0.3          # Low-pass filter coefficient (0-1)
  ki_velocity: 0.1           # Velocity integral gain for additional stability

# PID Velocity Controller Parameters
pid:
  kp: 0.45                   # Proportional gain (increased for cornering)
  ki: 0.15                   # Integral gain (increased to overcome turning stiction)
  kd: 0.0                    # Derivative gain
  max_throttle: 0.30         # Maximum throttle output
  min_throttle: 0.04         # Minimum throttle when coasting
  ei_max: 1.0                # Integral anti-windup limit
  v_ref: 0.6                 # Default reference velocity (m/s)



# SA-ACC Controller Parameters
sa_acc:
  tau: 0.4
  h: 0.5
  k1: -0.8
  k2: 2.5
  li: 5.0
  Li: 8.0
  acc_to_throttle_gain: 0.65
  max_throttle: 0.30

# ============================================================================
# LATERAL CONTROLLER CONFIGURATION
# ============================================================================

# Controller type options: 'pure_pursuit', 'stanley', 'lookahead', 'hybrid', 'path', 'pp_map'
lateral_controller_type: 'pp_map'  # legacy fallback

# Pure Pursuit Controller Parameters
pure_pursuit:
  lookahead_distance: 0.2    # Base lookahead distance (meters)
  k_steering: 0.4            # Proportional steering gain
  max_steering: 0.5         # Maximum steering angle (radians)
  adaptive_lookahead: true   # Enable adaptive lookahead based on distance
  # Turning section parameters (for corner-cutting prevention)
  curvature_threshold: 0.3   # Lane curvature threshold for turn detection
  turn_lookahead_offset: 0.1 # Lateral offset in turns (meters)
  turn_lookahead_gain: 1.5   # Lookahead distance multiplier in turns

# Map-based PP_Controller mode parameters (used when lateral_controller_type: 'pp_map')
pp_map:
  sample_ds: 0.02
  desired_speed: 0.6
  min_speed: 0.30
  kappa_speed_gain: 1.2
  max_speed: 0.7
  hard_turn_kappa: 0.85
  hard_turn_speed: 0.35
  t_clip_min: 0.4
  t_clip_max: 1.8
  m_l1: 0.45
  q_l1: 0.15
  speed_lookahead: 0.12
  lat_err_coeff: 0.3
  acc_scaler_for_steer: 1.0
  dec_scaler_for_steer: 1.0
  start_scale_speed: 0.15
  end_scale_speed: 0.9
  downscale_factor: 0.35
  speed_lookahead_for_steer: 0.1
  prioritize_dyn: false
  trailing_gap: 0.8
  trailing_p_gain: 0.6
  trailing_i_gain: 0.0
  trailing_d_gain: 0.1
  blind_trailing_speed: 0.2
  obstacle_avoidance_enabled: true
  obstacle_replan_period: 0.25      # [s] minimum time between local avoidance replans
  obstacle_min_detect_dist: 0.25    # [m] ignore detections closer than this (too late/noisy)
  obstacle_max_detect_dist: 2.0     # [m] far detections are ignored for local planning
  obstacle_car_radius: 0.22         # [m] local planner obstacle radius for cars
  obstacle_person_radius: 0.16      # [m] local planner obstacle radius for pedestrians
  obstacle_influence: 0.90          # [m] distance around obstacle where path is pushed away
  obstacle_clearance: 0.12          # [m] extra safety margin in addition to obstacle radius

# Stanley Controller Parameters
stanley:
  k_e: 0.5                   # Cross-track error gain
  k_soft: 1.0                # Softening gain to prevent division by zero
  max_steering: 0.5         # Maximum steering angle (radians)

# Lookahead Controller Parameters
lookahead:
  ri: 0.8                    # Desired inter-vehicle spacing (meters)
  hi: 0.3                    # Time headway (seconds)
  l_r: 0.141                 # Distance from CG to rear axle (meters)
  l_f: 0.115                 # Distance from CG to front axle (meters)
  k1: 1.0                    # Lateral control gain
  k2: 1.0                    # Yaw rate control gain
  max_steering: 0.5         # Maximum steering angle (radians)

# Fusion Lateral Controller Parameters (combines path + leader tracking)
fusion_lateral:
  mode: 'path_primary'       # 'path_primary', 'leader_primary', 'adaptive'
  path_weight: 0.7           # Weight for path reference (0-1)
  leader_weight: 0.3         # Weight for leader adjustment (0-1)
  deviation_threshold: 0.3   # Max leader deviation before override (radians)
  smoothing_factor: 0.8      # Output smoothing (0-1, higher = smoother)
  max_steering: 0.5         # Maximum steering angle (radians)

# ============================================================================
# VEHICLE PARAMETERS (for all controllers)
# ============================================================================
vehicle:
  wheelbase: 0.210           # Calibrated effective wheelbase (L_eff_m)
  l_r: 0.141                 # Distance from CG to rear axle (meters)
  l_f: 0.115                 # Distance from CG to front axle (meters)

# ============================================================================
# QUICK SWITCH PRESETS
# ============================================================================
# Uncomment the sections you want to use:

# ------------------------------------------------------------------------
# Preset 1: Aggressive Following (Tight spacing, responsive)
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'cacc'
# lateral_controller_type: 'pure_pursuit'
# cacc:
#   s0: 1.0
#   h: 0.3
#   K_spacing: 0.3
#   K_velocity: 0.08
# pure_pursuit:
#   lookahead_distance: 0.8
#   k_steering: 1.2

# ------------------------------------------------------------------------
# Preset 2: Conservative/Safe Following (Large spacing, smooth)
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'cacc'
# lateral_controller_type: 'stanley'
# cacc:
#   s0: 2.0
#   h: 0.7
#   K_spacing: 0.15
#   K_velocity: 0.03
# stanley:
#   k_e: 0.3
#   k_soft: 1.5

# ------------------------------------------------------------------------
# Preset 3: Simple Velocity Tracking (No spacing control)
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'pi'
# lateral_controller_type: 'pure_pursuit'

# ------------------------------------------------------------------------
# Preset 4: Best of Both Worlds (Adaptive hybrid controllers)
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'hybrid'
# lateral_controller_type: 'hybrid'

# ------------------------------------------------------------------------
# Preset 5: Advanced Lookahead Control
# ------------------------------------------------------------------------
# longitudinal_controller_type: 'cacc'
# lateral_controller_type: 'lookahead'
# lookahead:
#   k1: 1.2
#   k2: 1.0
#   ri: 1.5
