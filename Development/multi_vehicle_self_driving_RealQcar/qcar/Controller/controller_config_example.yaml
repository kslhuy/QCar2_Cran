# Longitudinal Controller Configuration
# This file shows how to easily switch between different controllers

# Controller type options: 'cacc', 'pi', 'hybrid'
longitudinal_controller_type: 'cacc'

# CACC Controller Parameters
cacc:
  s0: 1.5                    # Minimum spacing (meters)
  h: 0.5                     # Time headway (seconds)
  K_spacing: 0.2             # Spacing error gain
  K_velocity: 0.05           # Velocity error gain
  acc_to_throttle_gain: 0.5  # Conversion gain from acceleration to throttle
  max_throttle: 0.3          # Maximum throttle output
  alpha_filter: 0.3          # Low-pass filter coefficient (0-1)

# PI Velocity Controller Parameters
pi:
  kp: 0.1                    # Proportional gain
  ki: 1.0                    # Integral gain
  max_throttle: 0.3          # Maximum throttle output
  ei_max: 1.0                # Integral anti-windup limit

# Hybrid Controller Parameters (uses both CACC and PI)
hybrid:
  # Uses CACC when leader available, PI when not
  use_cacc_params: true      # Use params from 'cacc' section
  use_pi_params: true        # Use params from 'pi' section

# Quick Switch Presets
# Uncomment the one you want to use:

# For aggressive following with tight spacing:
# longitudinal_controller_type: 'cacc'
# cacc.s0: 1.0
# cacc.h: 0.3
# cacc.K_spacing: 0.3
# cacc.K_velocity: 0.08

# For conservative/safe following:
# longitudinal_controller_type: 'cacc'
# cacc.s0: 2.0
# cacc.h: 0.7
# cacc.K_spacing: 0.15
# cacc.K_velocity: 0.03

# For simple velocity tracking (no spacing control):
# longitudinal_controller_type: 'pi'

# For best of both worlds:
# longitudinal_controller_type: 'hybrid'
