name: Python portability
on: [push, pull_request, workflow_dispatch]
jobs:
  simulation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONNOUSERSITE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[simulation,test]"
      - run: python -m pip check
      - run: cmake -S Development/multi_vehicle_self_driving_RealQcar/qcar/electronics/native -B Development/multi_vehicle_self_driving_RealQcar/qcar/electronics/native/build
      - run: cmake --build Development/multi_vehicle_self_driving_RealQcar/qcar/electronics/native/build --config Release
      - name: Imports, resources, launchers and runtime regression tests
        run: python -m pytest -q
      - run: python -m build --wheel
      - name: Install the wheel and verify it outside the checkout
        shell: python
        run: |
          import os, pathlib, subprocess, sys, tempfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          with tempfile.TemporaryDirectory() as folder:
              subprocess.run([sys.executable, '-I', '-m', 'qcar', 'doctor', '--profile', 'simulation'], cwd=folder, check=True)
              subprocess.run([sys.executable, '-I', '-m', 'qcar', 'pipeline', '--duration', '.1'], cwd=folder, check=True)
